[project]
name = "thuvienphapluat"
version = "0.1.0"
description = "Hệ thống Cập nhật Văn bản Pháp luật Doanh nghiệp — Phase 1"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "playwright>=1.48",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",           # SQLite async driver (dev)
    "psycopg2-binary>=2.9",      # PostgreSQL driver (production)
    "python-telegram-bot>=21.0",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    # Kết xuất báo cáo PDF — pdf_exporter và report_pdf phụ thuộc trực tiếp,
    # thiếu là vỡ ngay khi sinh báo cáo.
    "reportlab>=4.0",
    # Vẽ biểu đồ nhúng vào báo cáo (report_theme)
    "matplotlib>=3.8",
    # Tìm kiếm vector trong SQLite; thiếu thì hybrid search thoái hoá về BM25
    "sqlite-vec>=0.1.6",
    # Bóc HTML biểu mẫu TVPL. Ruột mẫu do Aspose xuất từ Word: bảng lồng bảng,
    # rowspan/colspan, mỗi chữ một thẻ <span> riêng. html.parser trần không dựng
    # lại nổi cấu trúc bảng, mà bảng chính là toàn bộ nội dung của biểu mẫu.
    "beautifulsoup4>=4.12",
    # Xuất biểu mẫu ra .docx. Biểu mẫu sinh ra là để ĐIỀN — PDF không điền được,
    # nên đây là định dạng người dùng thật sự cần, không phải tuỳ chọn.
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",              # kiểm tra frontmatter YAML của vault trong test
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: chạy trên kho dữ liệu thật trong data/ và Legal-Vault/ (bỏ qua nếu chưa có dữ liệu)",
]
filterwarnings = [
    "ignore::DeprecationWarning:telegram.*",
]
