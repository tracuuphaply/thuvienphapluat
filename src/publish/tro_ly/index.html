<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trợ lý pháp lý · Kho văn bản &amp; biểu mẫu</title>
<meta name="description" content="Tra cứu văn bản quy phạm pháp luật và biểu mẫu doanh nghiệp, hỏi đáp có trích dẫn nguồn.">
<style>
/* ─────────────────────────────────────────────────────────────
   Hệ thiết kế theo Notion.

   Bản trước dùng bảng màu navy + son + vàng của tài liệu hành chính. Đẹp nhưng
   NẶNG: ba mảng màu bão hoà cạnh nhau kéo mắt về khung viền thay vì về chữ. Với
   một trang mà việc chính là ĐỌC văn bản dài và đối chiếu trích dẫn, nền phải lùi
   hẳn ra sau.

   MỘT giao diện tối, không có công tắc sáng/tối. Hai bảng màu là hai bảng phải
   soát mỗi lần đổi kiểu dáng, và bảng ít dùng luôn là bảng lặng lẽ hỏng — chính
   nó đã để lọt vụ nút sơ đồ đen thui khi mấy biến màu bị đổi tên.

   Notion làm điều đó bằng bốn nguyên tắc, chép nguyên ở đây:
     · nền gần như trắng, chữ xám ấm #37352f — không phải đen tuyền
     · viền mảnh gần như vô hình, phân tách bằng KHOẢNG TRỐNG chứ không bằng nét
     · màu chỉ dùng cho nhãn trạng thái, dạng pastel nền nhạt chữ đậm
     · trạng thái hover là một lớp xám mờ, không phải đổi màu
   ───────────────────────────────────────────────────────────── */
/* HAI BẢNG MÀU, và bảng TỐI là mặc định — `:root` mang trực tiếp bộ tối, còn bộ
   sáng nằm trong `[data-theme=light]`. Viết ngược lại (sáng ở `:root`) thì mọi
   biến quên khai báo lại sẽ rơi về màu sáng trên nền tối — hỏng thành không đọc
   được chữ, mà lại chỉ hỏng ở một bảng nên dễ lọt.
   Bài học cũ vẫn đúng: bảng ít dùng là bảng lặng lẽ hỏng. Nên mọi biến màu đều
   phải có mặt ở CẢ HAI khối dưới đây — thiếu một biến ở khối sáng là một chỗ
   dùng màu tối trên nền sáng. */
:root{
  color-scheme:dark;
  --bg:#191919; --bg-2:#202020; --bg-3:#2c2c2c;
  --fg:#d4d4d4; --fg-2:#9b9b9b; --fg-3:#6f6f6f;
  --line:#2f2f2f; --line-2:rgba(255,255,255,.094);
  --accent:#529cca; --accent-bg:rgba(82,156,202,.16);
  /* Chữ đặt TRÊN mảng accent đặc. Không dùng #fff: #529cca là xanh nhạt, chữ
     trắng trên nó chỉ được 2,5:1 — dưới ngưỡng đọc được. Chữ gần đen được 8:1. */
  --tren-accent:#0b1116;
  --hover:rgba(255,255,255,.055); --hover-2:rgba(255,255,255,.09);
  --mark:#59563b;

  /* Nhãn trạng thái — bộ pastel tối của Notion. Nền trầm, chữ cùng tông sáng,
     không viền: đủ để phân biệt mà không hút mắt khỏi chữ chính. */
  --t-red-bg:#522e2a;    --t-red:#ff7369;
  --t-green-bg:#2d3d33;  --t-green:#4dab9a;
  --t-yellow-bg:#59563b; --t-yellow:#ffdc49;
  --t-orange-bg:#5c3b23; --t-orange:#ffa344;
  --t-blue-bg:#2b4661;   --t-blue:#5aa9e6;
  --t-gray-bg:#373737;   --t-gray:#9b9b9b;

  --sh-1:rgba(0,0,0,.3) 0 0 0 1px, rgba(0,0,0,.4) 0 5px 10px,
         rgba(0,0,0,.5) 0 15px 40px;
  --sh-2:rgba(255,255,255,.05) 0 0 0 1px, rgba(0,0,0,.3) 0 2px 4px;
  --r:4px; --r-2:8px;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,
         "Apple Color Emoji",Arial,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --c1:296px; --c3:344px; --le-giua:26px;
}

:root[data-theme=light]{
  color-scheme:light;
  --bg:#fff; --bg-2:#f7f7f5; --bg-3:#f1f1ef;
  --fg:#37352f; --fg-2:#787774; --fg-3:#9b9a97;
  --line:#e9e9e7; --line-2:rgba(55,53,47,.09);
  /* #1868b7 chứ không phải #2383e2 của Notion. Đo tương phản trên nền trắng:
     xanh Notion được 3,5 — dưới ngưỡng 4,5 cho chữ nhỏ, mà biến này dùng cho
     liên kết, số trích dẫn và chữ trên nút Gửi. #1868b7 được 5,3. Nền nhạt
     (--accent-bg) giữ nguyên tông sáng nên nhãn vẫn nhẹ như cũ. */
  --accent:#1868b7; --accent-bg:rgba(35,131,226,.13);
  --tren-accent:#fff;
  --hover:rgba(55,53,47,.06); --hover-2:rgba(55,53,47,.11);
  --mark:#fdecc8;
  --t-red-bg:#fbe4e4;    --t-red:#8a3a37;
  --t-green-bg:#dbeddb;  --t-green:#28553a;
  --t-yellow-bg:#fbf3db; --t-yellow:#6b5518;
  --t-orange-bg:#faebdd; --t-orange:#7a4318;
  --t-blue-bg:#d3e5ef;   --t-blue:#28556f;
  --t-gray-bg:#e3e2e0;   --t-gray:#5d5b57;
  --sh-1:rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px,
         rgba(15,15,15,.2) 0 9px 24px;
  --sh-2:rgba(15,15,15,.04) 0 0 0 1px, rgba(15,15,15,.06) 0 2px 4px;
}
:root[data-theme=light] code{color:#eb5757}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font:15px/1.5 var(--font); color:var(--fg); background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-2)}
a:hover{border-bottom-color:var(--fg-3)}
code,kbd{font-family:var(--mono);font-size:.86em;
  background:var(--hover);border-radius:3px;padding:1px 4px;color:#ff7369}
::selection{background:var(--accent-bg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--fg-3);background-clip:content-box}

/* ── Thanh trên ── */
header.top{
  flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:0 12px; height:52px; background:var(--bg);
  border-bottom:1px solid var(--line); z-index:40;
}
.brand{
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;
  white-space:nowrap;padding:5px 9px 5px 6px;border-radius:var(--r);color:var(--fg);
}
.brand .ic{font-size:21px;line-height:1}
.brand:hover{background:var(--hover)}
.tim-toan{flex:1 1 auto;max-width:520px;position:relative}
.tim-toan input{
  width:100%; padding:5px 10px 5px 30px; border-radius:var(--r);
  border:1px solid transparent; background:var(--bg-3); color:var(--fg); outline:none;
  font-size:14px;
}
.tim-toan input::placeholder{color:var(--fg-3)}
.tim-toan input:focus{background:var(--bg);border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-bg)}
.tim-toan .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--fg-3);font-size:13px;pointer-events:none}
.top-actions{display:flex;gap:2px;margin-left:auto}
.top-actions button{
  color:var(--fg-2); padding:5px 8px; border-radius:var(--r); font-size:14px;
  line-height:1;
}
.top-actions button:hover{background:var(--hover);color:var(--fg)}

/* ── Ba cột: Nguồn · Hỏi đáp · Trích dẫn ──
   Chat ở GIỮA, không phải ở rìa. Đây là khác biệt cốt lõi với bản trước: việc
   chính của trang là hỏi đáp, còn duyệt nguồn và đối chiếu trích dẫn là hai việc
   PHỤ TRỢ cho nó — nên chúng kèm hai bên, không đẩy nó ra góc. */
.cols{flex:1 1 auto;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.c1{flex:0 0 var(--c1);background:var(--bg-2);border-right:1px solid var(--line)}
.c2{flex:1 1 auto;background:var(--bg)}
.c3{flex:0 0 var(--c3);background:var(--bg-2);border-left:1px solid var(--line)}
/* Cột trích dẫn chỉ tồn tại khi có câu trả lời. Trước khi hỏi thì nó là một cột
   rỗng 344 px nói "chưa có trích dẫn nào" — chiếm chỗ chỉ để thông báo mình đang
   trống. Chỗ đó trả cho sơ đồ. */
body[data-cotd=false] .c3{display:none}
body[data-cotd=false] .mnav button[data-cot=col3]{display:none}

.p-head{
  flex:0 0 auto;display:flex;align-items:baseline;gap:8px;
  padding:13px 14px 9px;font-size:14px;font-weight:600;
}
.p-head .dem-tong,.p-head .nhan{
  font-size:12px;font-weight:400;color:var(--fg-3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── Cột trái: chọn kho + lọc + danh sách ── */
.kho-chon{display:flex;gap:4px;padding:0 10px 8px;flex:0 0 auto}
.kho-chon button{
  flex:1;padding:6px 8px;border-radius:var(--r);font-size:13px;color:var(--fg-2);
  background:var(--bg);border:1px solid var(--line);text-align:left;line-height:1.3;
}
.kho-chon button b{display:block;font-size:11.5px;font-weight:500;color:var(--fg-3);
  font-variant-numeric:tabular-nums}
.kho-chon button:hover{background:var(--hover)}
.kho-chon button[aria-selected=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.kho-chon button[aria-selected=true] b{color:var(--bg);opacity:.7}

.loc{display:flex;gap:5px;padding:0 10px 9px;flex:0 0 auto;flex-wrap:wrap}
.loc select{
  flex:1 1 46%;min-width:0;padding:4px 6px;font-size:12px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg);color:var(--fg-2);
}
.loc select:first-child{flex:1 1 100%}
.ds{flex:1 1 auto;overflow-y:auto;padding:0 8px 8px}
.muc{
  display:block;width:100%;text-align:left;background:transparent;
  border-radius:var(--r); padding:7px 8px;margin-bottom:1px;
}
.muc:hover{background:var(--hover)}
.muc[aria-current=true]{background:var(--hover-2)}
.muc .sh{font-family:var(--mono);font-size:11px;color:var(--fg-3);letter-spacing:-.01em}
.muc .tt{font-size:13.5px;line-height:1.4;margin-top:1px;color:var(--fg)}
.muc .meta{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}
.muc .meta span:not(.pill){font-size:11px;color:var(--fg-3)}
.pill{
  display:inline-flex;align-items:center;padding:1px 7px;border-radius:3px;
  font-size:11px;font-weight:500;white-space:nowrap;line-height:1.5;
}
.pill.ok{background:var(--t-green-bg);color:var(--t-green)}
.pill.warn{background:var(--t-yellow-bg);color:var(--t-yellow)}
.pill.bad{background:var(--t-red-bg);color:var(--t-red)}
.pill.unk{background:var(--t-gray-bg);color:var(--t-gray)}
.pill.info{background:var(--t-blue-bg);color:var(--t-blue)}
.pill.cam{background:var(--t-orange-bg);color:var(--t-orange)}
.trong{padding:26px 14px;text-align:center;color:var(--fg-3);font-size:13px;line-height:1.5}
.c1 .moc{flex:0 0 auto;padding:10px 14px 14px;font-size:11px;color:var(--fg-3);
  border-top:1px solid var(--line);line-height:1.5}

/* ── Cột giữa: hỏi đáp ── */
.chat{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
/* Sơ đồ nền: chiếm phần trên của khung hỏi đáp, co giãn theo khung. Chiều cao
   tối thiểu 260 px — dưới mức đó thì 4.170 nút thành một vạch, thà không vẽ. */
/* MỘT lề ngang duy nhất cho cả cột giữa — sơ đồ, ô nhập, câu gợi ý, dòng ghi
   chú đều bám cùng hai cạnh. Trước đây sơ đồ dùng lề 26 px còn ô nhập dùng
   `max-width:680px; margin:auto`, nên hai khối rộng khác nhau và cột giữa trông
   như hai cột lệch nhau. */
.sodo.nen{
  flex:1 1 auto;min-height:260px;
  margin:4px var(--le-giua) 10px;
}
.sodo.nen canvas{height:100%}
.chat[data-nen=false] .sodo.nen{display:none}
.chat[data-nen=true] .chat-log{flex:0 0 auto;max-height:34%}
.chat-log{flex:1 1 auto;overflow-y:auto;padding:6px var(--le-giua) 8px}
.tn{margin:0 auto 20px;max-width:680px}
.tn .ai{font-size:12px;color:var(--fg-3);margin-bottom:5px;font-weight:500}
.tn .noi{white-space:pre-wrap;font-size:15px;line-height:1.65}
.tn.u .noi{background:var(--bg-3);border-radius:var(--r-2);padding:10px 14px}
.buoc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-3);padding:2px 0}
.buoc .tt{width:6px;height:6px;border-radius:50%;background:var(--line-2);flex:0 0 auto}
.buoc.dang .tt{background:var(--accent);animation:nhay 1.1s infinite}
.buoc.xong .tt{background:var(--t-green)}
.buoc.loi .tt{background:var(--t-red)}
@keyframes nhay{50%{opacity:.25}}
.tdan{
  display:inline-block;min-width:16px;height:16px;padding:0 4px;margin:0 1px;
  border-radius:3px;background:var(--accent-bg);color:var(--accent);
  font:500 11px/16px var(--mono);text-align:center;vertical-align:2px;cursor:pointer;
}
.tdan:hover,.tdan.chon{background:var(--accent);color:var(--tren-accent)}
.chat-in{flex:0 0 auto;padding:0 var(--le-giua) 14px}
.chat-in form{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{
  flex:1;resize:none;min-height:40px;max-height:150px;padding:9px 12px;
  border:1px solid var(--line);border-radius:var(--r-2);background:var(--bg);
  outline:none;box-shadow:var(--sh-2);
}
.chat-in textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.chat-in button.gui{
  padding:9px 16px;border-radius:var(--r-2);background:var(--accent);
  color:var(--tren-accent);
  font-weight:500;font-size:14px;
}
.chat-in button.gui:disabled{background:var(--bg-3);color:var(--fg-3);cursor:not-allowed}
.chat-in .ghi{margin:8px 0 0;font-size:12px;color:var(--fg-3);line-height:1.5}
/* Câu gợi ý thành MỘT DẢI TRƯỢT NGANG. Xuống dòng thì ba câu chiếm ba hàng, tức
   ~90 px chiều cao lấy khỏi sơ đồ — mà sơ đồ là thứ cần chỗ, còn gợi ý chỉ là
   lối vào. Một hàng trượt ngang giữ đủ ba câu trong 34 px.
   Ẩn thanh cuộn: một thanh cuộn ngang trên hàng cao 34 px chiếm gần một phần ba
   chiều cao của chính nó. */
.goi-y{
  display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:0 0 9px;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:1px;
}
.goi-y::-webkit-scrollbar{display:none}
.goi-y button{
  flex:0 0 auto;white-space:nowrap;
  padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-2);
  font-size:13px;color:var(--fg-2);background:var(--bg);
}
.goi-y button:hover{background:var(--hover);color:var(--fg)}

/* ── Cột phải: thẻ trích dẫn ──
   Bản trước là panel TRƯỢT ĐÈ lên chat rồi tắt đi. Nhưng trích dẫn là thứ người
   đọc đối chiếu LIÊN TỤC trong lúc đọc câu trả lời — che đi rồi mở lại từng cái
   là bắt họ mất mạch mỗi lần kiểm một nguồn. */
/* Sơ đồ trích dẫn: cao cố định, không co giãn. Nó là phần phụ chú cho danh
   sách thẻ bên dưới, nên không được lấn chỗ của danh sách. */
/* `.sodo.td-sodo` chứ không phải `.td-sodo`: quy tắc chung `.sodo canvas` đặt
   height 360px và có CÙNG độ đặc hiệu (0,1,1), mà nó nằm sau trong file nên nó
   thắng. Hệ quả đã gặp: canvas cao 360 px nằm trong hộp 215 px, phần dưới bị
   `overflow:hidden` cắt mất — nhìn ra y như sơ đồ không tự khớp khung, trong
   khi phép khớp vẫn chạy đúng trên một khung mà nó tưởng là cao 360. */
.td-sodo{flex:0 0 auto;height:215px;margin:0 10px 9px}
.sodo.td-sodo canvas{height:100%}
/* Khung 324 px không đủ chỗ cho dòng hướng dẫn thao tác — nó xuống hai dòng và
   che mất phần dưới sơ đồ. Cùng nội dung đã có ở sơ đồ nền và sơ đồ popup. */
.td-sodo .ghi .goi{display:none}
.td-ds{flex:1 1 auto;overflow-y:auto;padding:0 10px 14px}
.td{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-2);
  padding:9px 11px;margin-bottom:7px;cursor:pointer;
}
.td:hover{border-color:var(--fg-3)}
.td.chon{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.td .so{
  display:inline-block;min-width:17px;height:17px;padding:0 4px;border-radius:3px;
  background:var(--accent-bg);color:var(--accent);
  font:500 11px/17px var(--mono);text-align:center;margin-right:6px;
}
.td .sh{font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.td .tt{font-size:13px;line-height:1.45;margin-top:5px;color:var(--fg)}
.td .doan{
  font-size:12.5px;line-height:1.55;margin-top:7px;padding-top:7px;
  border-top:1px solid var(--line);color:var(--fg-2);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.td.chon .doan{-webkit-line-clamp:unset}
.td .mo{margin-top:8px;font-size:12px;color:var(--accent)}


/* ── Popup tài liệu ──
   <dialog> chứ không phải div tự dựng: nó cho sẵn backdrop, phím Esc, bẫy tiêu
   điểm và inert cho phần nền. Tự làm lại ba thứ đó bằng tay là ba chỗ để sai. */
dialog.doc-modal{
  border:0;padding:0;background:var(--bg);color:var(--fg);
  width:min(880px,94vw);max-width:none;height:min(86vh,940px);max-height:86vh;
  border-radius:var(--r-2);box-shadow:var(--sh-1);overflow:hidden;
}
dialog.doc-modal::backdrop{background:rgba(15,15,15,.6);backdrop-filter:blur(2px)}
.doc-modal .mh{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--line);
}
.doc-modal .mh .nhan{
  flex:1;min-width:0;font-size:12.5px;color:var(--fg-3);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Biểu tượng đặt TUYỆT ĐỐI, thân là khối thường.
   Bản flex có ba phần tử con (::before, <b>, chữ thân) và mọi cách xếp chúng đều
   vỡ theo một kiểu: hoặc tiêu đề thành cột hẹp ba dòng, hoặc biểu tượng rơi
   xuống dòng riêng. Một `position:absolute` bỏ hẳn cuộc thương lượng đó. */
.canh-bao{

/* 860–1040px: hai cột. Cột NGUỒN ở lại, còn HỎI ĐÁP và TRÍCH DẪN thay phiên
   nhau qua thanh dưới. Chọn bỏ cột nào là chọn có ý: mất cột trích dẫn thì vẫn

@media(max-width:1040px){

<body>

<header class="top">

<div class="cols">

       Gộp hai cột cũ (điều hướng kho + danh mục) thành MỘT. Bản trước
       chiếm hai cột cho việc duyệt và đẩy chat ra rìa phải; NotebookLM đặt

  <nav class="col c1" id="col1" data-mo="true">
    <div class="p-head">

      <span class="dem-tong" id="dem-tong"></span>
    </div>

    <div class="kho-chon" role="tablist">

    <div class="loc">

      <select id="loc-hl"><option value="con_hieu_luc">Còn hiệu lực</option></select>
      <select id="loc-cap"><option value="">Mọi cấp</option></select>

    <div class="ds" id="ds"><div class="trong">Đang nạp dữ liệu…</div></div>

  <!-- ─── GIỮA: HỎI ĐÁP ─────────────────────────────────────────── -->
  <main class="col c2" id="col2">
    <div class="p-head">
      <span>Hỏi đáp</span>

    </div>
    <div class="chat" id="chat" data-nen="false">
      <!-- Sơ đồ toàn kho chiếm chỗ trống của khung hỏi đáp khi chưa có câu nào.
           Chỗ này vốn là một khoảng trắng lớn, mà cái đáng nhìn nhất của kho —
           4.170 văn bản dẫn chiếu nhau — thì nằm giấu trong popup. Có câu trả

        <form id="chat-form">
          <textarea id="chat-q" rows="1" placeholder="Hỏi về nghĩa vụ, thời hạn, mức phạt, biểu mẫu phải nộp…"></textarea>
          <button class="gui" type="submit" id="chat-gui">Gửi</button>

  </main>

  <!-- ─── PHẢI: TRÍCH DẪN ────────────────────────────────────────
