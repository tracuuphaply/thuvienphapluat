  </div>
</dialog>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   Trang trợ lý pháp lý — tĩnh, không phụ thuộc thư viện ngoài.

   BA QUYẾT ĐỊNH KIẾN TRÚC, mỗi cái vì một lý do đo được:

   1. KHÔNG dùng contentIndex.json của Quartz (16,77 MB thô). Trang này nạp
      du-lieu.json ~1,5 MB chỉ gồm metadata. Cùng dữ liệu để lọc và tra, mà
      không có cú JSON.parse 16 MB chặn luồng chính.

   2. SƠ ĐỒ CHỈ VẼ LÁNG GIỀNG. Đồ thị 4.201 nút / 23.801 cạnh không bao giờ đọc
      được dù vẽ nhanh cỡ nào. Ở đây chỉ vẽ bậc 1 quanh văn bản đang mở, và
      chặn trần số nút — văn bản trung tâm thật sự có bậc rất cao
      (32/2001/QH10 có 1.780 cạnh), nên không chặn trần là vẽ ra cục rối.

   3. TRÍCH DẪN [N] LÀ THÀNH PHẦN BẤM ĐƯỢC, không phải chữ trang trí. Bấm vào
      là mở panel bên phải với đúng đoạn nguồn — đây là toàn bộ điểm khác giữa
      "chatbot" và "trợ lý pháp lý kiểm chứng được".
   ═══════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Gỡ dấu tiếng Việt để tra không dấu. Đ/đ là ký tự RIÊNG (U+0110/U+0111), không
   phải chữ kèm dấu tổ hợp, nên NFD không tách được — phải thay tay. Thiếu bước
   này thì gõ "nghi dinh" không ra "NGHỊ ĐỊNH", cách gõ phổ biến nhất. */
const goDau = s => String(s ?? "").replace(/Đ/g, "D").replace(/đ/g, "d")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

/* ══════════════ CẤU HÌNH API — SỬA Ở ĐÂY ══════════════
   Đặt trong mã nguồn, KHÔNG phải trong một hộp thoại cho người dùng nhập. Đây
   là trang hướng tới người tra cứu pháp luật, không phải người vận hành: bắt họ
   tự dán địa chỉ API và khoá là bắt họ làm việc của người dựng trang, và tệ hơn
   là dạy họ dán khoá vào một ô mà bất kỳ trang nào cũng có thể bắt chước.

   Để trống thì phần hỏi đáp chạy ở chế độ tra kho: nó tìm theo tiêu đề, xếp hạng
   ưu tiên văn bản còn hiệu lực, và KHÔNG gọi mô hình nào.

   Hợp đồng API: POST tới `URL` với body {messages, stream:true}, trả về SSE theo
   thứ tự sub_queries → retrieval → context_ready → tool_call → answer. Xem
   goiAPI() bên dưới để biết đúng những trường nào được đọc. */
const API = {
  URL: "",          // ví dụ: "https://api.example.com/chat"
  KHOA: "",         // gửi kèm dạng "Authorization: Bearer <khoá>" nếu có
};

/* Tuỳ chỉnh hiển thị, nhớ trong localStorage của chính trình duyệt này. */
const TC = {
  get toi() { return localStorage.getItem("troly.theme") !== "light"; },
  get sodo() { return localStorage.getItem("troly.sodo") !== "0"; },
};

function datTheme(toi) {
  document.documentElement.dataset.theme = toi ? "dark" : "light";
  localStorage.setItem("troly.theme", toi ? "dark" : "light");
  $("#ct-toi")?.setAttribute("aria-checked", String(toi));
  /* Màu nút và cạnh sơ đồ đọc từ biến CSS MỘT LẦN lúc khởi tạo — đổi bảng màu
     thì phải nạp lại chúng, không thì sơ đồ giữ nguyên màu của bảng cũ và thành
     chữ tối trên nền tối. Đây đúng lỗi đã gặp khi đổi tên biến màu lần trước. */
  if (SD.cv && SD.cv.isConnected) { sdMauLai(); }
}

function datVeSoDo(bat) {
  localStorage.setItem("troly.sodo", bat ? "1" : "0");
  $("#ct-sodo")?.setAttribute("aria-checked", String(bat));
  if (S.d) datSoDo();
}

const S = {                        /* trạng thái ứng dụng */
  d: null, kho: "van_ban", linhVuc: null,
  mo: null, hoiThoai: [], nguon: {}, tdChon: null, dangChay: false,
  idxVB: [], idxBM: [], ke: null, dsCuoi: null, boCucKho: null,
};

/* ── Cờ hiệu lực → hình thức ─────────────────────────────── */
const KIEU_HL = {
  con_hieu_luc: "ok", het_toan_bo: "bad", het_hieu_luc: "bad",
  het_mot_phan: "warn", can_kiem_tra: "warn", co_ban_thay_the: "warn",
  chua_hieu_luc: "info", khong_ro: "unk",
};
const nhanHL = (ma, kho) =>
  (kho === "bieu_mau" ? S.d.hieu_luc_bm : S.d.hieu_luc_vb)[ma] || "Chưa xác minh";
const pillHL = (ma, kho) =>
  `<span class="pill ${KIEU_HL[ma] || "unk"}">${esc(nhanHL(ma, kho))}</span>`;

/* ════════════════ Nạp dữ liệu ════════════════ */
async function nap() {
  /* `cache: "no-cache"` là BẮT BUỘC, không phải tuỳ chọn tối ưu.
     GitHub Pages trả `cache-control: max-age=600` cho du-lieu.json, mà tên file
     thì không đổi giữa các lần đăng. Hệ quả đã gặp thật: đăng xong 105 biểu mẫu
     mà trình duyệt vẫn hiện 41 mẫu của lần đăng trước, không có dấu hiệu nào cho
     người dùng biết. Với một trang pháp lý, dữ liệu cũ là SAI chứ không phải
     chậm — hiệu lực văn bản đổi mỗi ngày.

     "no-cache" không phải "không cache": nó vẫn dùng bản đã lưu, chỉ bắt buộc
     hỏi lại máy chủ trước. Không đổi thì máy chủ trả 304 vài trăm byte. */
  const r = await fetch("du-lieu.json", { cache: "no-cache" });
  if (!r.ok) throw new Error("Không nạp được du-lieu.json (" + r.status + ")");
  S.d = await r.json();

  /* Chỉ mục tra cứu: dựng MỘT LẦN lúc nạp, không dựng lại mỗi lần gõ.
     4.201 văn bản × goDau() cho mỗi lần nhấn phím là ~40 ms trễ thấy được. */
  S.idxVB = S.d.van_ban.map((v, i) => ({ i, k: goDau(v.n + " " + v.t) }));
  S.idxBM = S.d.bieu_mau.map((v, i) => ({ i, k: goDau(v.k + " " + v.t) }));

  /* Danh sách kề hai chiều cho sơ đồ láng giềng. */
  S.ke = new Map();
  for (const [a, b, t] of S.d.do_thi.canh) {
    if (!S.ke.has(a)) S.ke.set(a, []);
    if (!S.ke.has(b)) S.ke.set(b, []);
    S.ke.get(a).push([b, t, 1]);
    S.ke.get(b).push([a, t, -1]);
  }

  $("#dem-vb").textContent = S.d.van_ban.length.toLocaleString("vi");
  $("#dem-bm").textContent = S.d.bieu_mau.length.toLocaleString("vi");
  /* Ngày dựng dữ liệu hiện ngay trên giao diện: người dùng phải TỰ kiểm được
     mình đang xem bản nào, không phải tin lời trang. */
  $("#moc-du-lieu").textContent = "Dữ liệu dựng ngày "
    + S.d.tao_luc.split("-").reverse().join("/");
  dungLoc(); dungNhom(); veDanhSach();
}

function dungLoc() {
  const hl = $("#loc-hl"), cap = $("#loc-cap");
  /* KHÔNG có mục "Mọi hiệu lực", và "Còn hiệu lực" là mặc định.
     Kho có 4.201 văn bản mà phần lớn đã hết hiệu lực; trộn chung thì danh sách
     mở ra toàn văn bản chết, và với một trang pháp lý thì văn bản chết đứng
     trước là dẫn người đọc đi sai. Muốn xem trạng thái khác thì chọn thẳng
     trạng thái đó — không mục nào bị mất, chỉ không còn mục gộp.
     Ô tra cứu vẫn KHÔNG chịu bộ lọc này: gõ đúng số hiệu một văn bản đã hết
     hiệu lực thì phải ra nó, không thì người dùng tưởng kho không có. */
  hl.innerHTML = "";
  const bang = S.kho === "bieu_mau" ? S.d.hieu_luc_bm : S.d.hieu_luc_vb;
  for (const [ma, ten] of Object.entries(bang))
    hl.insertAdjacentHTML("beforeend",
      `<option value="${ma}"${ma === "con_hieu_luc" ? " selected" : ""}>${esc(ten)}</option>`);
  if (!hl.value) hl.selectedIndex = 0;
  cap.hidden = S.kho === "bieu_mau";
  if (cap.options.length <= 1)
    for (const [ma, ten] of Object.entries(S.d.cap))
      if (+ma <= 9) cap.insertAdjacentHTML("beforeend", `<option value="${ma}">${esc(ten)}</option>`);
}

/* Lĩnh vực / nghiệp vụ là một Ô CHỌN, không còn là cây nút bấm.
   Cây cũ chiếm cả một cột riêng cho 27 lĩnh vực — đúng thứ đẩy chat ra rìa. Cùng
   thông tin ấy nằm gọn trong một select, và số đếm vẫn giữ nguyên trong nhãn nên
   không mất dữ kiện nào. */
function dungNhom() {
  const el = $("#loc-lv");
  const dem = new Map();
  let ds, nhan;
  if (S.kho === "van_ban") {
    nhan = "Mọi lĩnh vực";
    for (const v of S.d.van_ban) dem.set(v.f, (dem.get(v.f) || 0) + 1);
    ds = S.d.linh_vuc;
  } else {
    nhan = "Mọi nghiệp vụ";
    for (const b of S.d.bieu_mau) for (const nv of b.v) dem.set(nv, (dem.get(nv) || 0) + 1);
    ds = S.d.nghiep_vu;
  }
  el.innerHTML = `<option value="">${nhan}</option>` + ds
    .filter(x => dem.get(x.ma))
    .map(x => `<option value="${esc(String(x.ma))}">${esc(x.ten)} (${dem.get(x.ma)})</option>`)
    .join("");
  el.value = S.linhVuc == null ? "" : String(S.linhVuc);
}

/* ════════════════ Danh sách ════════════════ */
function locHienTai() {
  const hl = $("#loc-hl").value, cap = $("#loc-cap").value;
  if (S.kho === "van_ban") {
    return S.d.van_ban
      .map((v, i) => ({ v, i }))
      .filter(({ v }) =>
        (S.linhVuc == null || v.f === S.linhVuc) &&
        (!hl || v.e === hl) && (!cap || String(v.c) === cap));
  }
  return S.d.bieu_mau
    .map((v, i) => ({ v, i }))
    .filter(({ v }) =>
      (S.linhVuc == null || v.v.includes(S.linhVuc)) && (!hl || v.e === hl));
}

const TRAN_DS = 300;   /* vẽ 4.201 thẻ một lúc là treo trang; 300 đủ để cuộn */

function veDanhSach(ds) {
  const el = $("#ds");
  // Nhớ danh sách đang hiển thị. Không nhớ thì mở một kết quả tra cứu sẽ vẽ lại
  // danh sách MẶC ĐỊNH và xoá mất kết quả vừa tìm — người dùng phải gõ lại câu
  // tra cho từng tài liệu muốn xem.
  if (ds !== undefined) S.dsCuoi = ds;
  let items = (ds !== undefined ? ds : S.dsCuoi) || locHienTai();
  /* CÒN HIỆU LỰC LÊN TRƯỚC — áp cho cả danh sách lọc và kết quả tra cứu.
     Đặt ở đây chứ không đặt trong locHienTai() vì kết quả tra cứu đi đường
     riêng, không qua bộ lọc; để trong đó thì tra cứu vẫn trộn lẫn. */
  items = items.slice().sort((a, b) =>
    (a.v.e === "con_hieu_luc" ? 0 : 1) - (b.v.e === "con_hieu_luc" ? 0 : 1));
  $("#dem-tong").textContent = items.length.toLocaleString("vi") + " mục";
  if (!items.length) {
    el.innerHTML = '<div class="trong">Không có tài liệu nào khớp bộ lọc.</div>';
    return;
  }
  const cat = items.slice(0, TRAN_DS);
  el.innerHTML = cat.map(({ v, i }) => S.kho === "van_ban"
    ? `<button class="muc" data-kho="van_ban" data-i="${i}"
         ${S.mo?.kho === "van_ban" && S.mo?.i === i ? 'aria-current="true"' : ""}>
         <div class="sh">${esc(v.n)}</div>
         <div class="tt">${esc(v.t.length > 105 ? v.t.slice(0, 103) + "…" : v.t)}</div>
         <div class="meta">${pillHL(v.e, "van_ban")}<span>${esc(v.l)}</span>
           ${v.d ? `<span>${esc(v.d)}</span>` : ""}</div></button>`
    : `<button class="muc" data-kho="bieu_mau" data-i="${i}"
         ${S.mo?.kho === "bieu_mau" && S.mo?.i === i ? 'aria-current="true"' : ""}>
         <div class="sh">${esc(v.k)}</div>
         <div class="tt">${esc(v.t.length > 105 ? v.t.slice(0, 103) + "…" : v.t)}</div>
         <div class="meta">${pillHL(v.e, "bieu_mau")}
           ${v.g ? '<span class="pill bad">Nguồn đã gỡ</span>' : ""}</div></button>`
  ).join("") + (items.length > TRAN_DS
    ? `<div class="trong">Còn ${items.length - TRAN_DS} tài liệu nữa —
       thu hẹp bằng ô tra cứu hoặc bộ lọc.</div>` : "");
}

/* ════════════════ Tra cứu ════════════════ */
function tra(cau) {
  const t = goDau(cau).trim();
  if (!t) return null;
  const tu = t.split(/\s+/).filter(Boolean);
  const khop = (idx, ds) => idx
    .filter(x => tu.every(w => x.k.includes(w)))
    .slice(0, 400)
    .map(x => ({ v: ds[x.i], i: x.i }));
  return S.kho === "van_ban" ? khop(S.idxVB, S.d.van_ban) : khop(S.idxBM, S.d.bieu_mau);
}

/* ════════════════ Mở tài liệu ════════════════ */
const GOC = "..";   /* trang Quartz nằm ở thư mục cha của /tro-ly/ */

/* Bộ dữ liệu chỉ ship ID file, không ship URL: tiền tố dài 32 ký tự và lặp y hệt
   ở 3.883 văn bản — ~124 KB không mang thông tin nào. Quy tắc ghép nằm ở đây và
   trong bảng `_truong` của chính file dữ liệu. */
const urlDrive = id => `https://drive.google.com/file/d/${id}/view`;

/* Tài liệu mở thành POPUP, không chiếm chỗ của khung hỏi đáp.
   Bản trước chia đôi cột 3 và người dùng nói đúng: tài liệu chèn mất không gian
   chat. Dùng <dialog> chứ không tự dựng div — nó cho sẵn backdrop, phím Esc, bẫy
   tiêu điểm và inert cho nền; tự làm lại ba thứ đó bằng tay là ba chỗ để sai. */
function moTaiLieu(kho, i) {
  S.mo = { kho, i };
  const v = (kho === "van_ban" ? S.d.van_ban : S.d.bieu_mau)[i];
  $("#doc-nhan").textContent = kho === "van_ban" ? v.n : v.k;
  /* Nhãn nút phải nói đúng nó sẽ mở ra cái gì. "Trang gốc" khi nó dẫn tới một
     trang chỉ có dữ kiện là hứa hẹn sai. */
  $("#doc-goc").textContent = v.g ? "↗ Toàn văn" : "↗ Trang dữ kiện";
  $("#doc-goc").title = v.g
    ? "Mở bản toàn văn kho đang giữ (Google Drive)"
    : "Mở trang dữ kiện — kho chưa có bản toàn văn của văn bản này";
  $("#doc-noi").innerHTML = kho === "van_ban" ? htmlVanBan(v, i) : htmlBieuMau(v);
  $("#doc-noi").scrollTop = 0;
  veDanhSach(undefined);          // giữ nguyên danh sách đang xem
  const d = $("#dlg-doc");
  if (!d.open) d.showModal();
  /* Sơ đồ khởi động SAU showModal(), không phải sau khi gắn markup.
     <dialog> chưa mở thì nội dung bên trong CHƯA CÓ BỐ CỤC: getBoundingClientRect
     trả 0, canvas nhận width 0 và không vẽ được gì. Lỗi này im lặng — không có
     ngoại lệ nào, chỉ là một khung trống. */
  if (kho === "van_ban" && TC.sodo) { SD.tapChoSan = null; khoiSoDo(i, $("#sodo-cv"), false); }
  else { SD.id++; SD.cv = null; }   /* trang biểu mẫu không có sơ đồ — dừng cái đang chạy */
}

function dongTaiLieu() {
  SD.id++;            /* cắt vòng lặp mô phỏng: đóng popup là hết việc của nó */
  SD.cv = null;
  const d = $("#dlg-doc");
  if (d.open) d.close();
  /* Sơ đồ nền nhận lại bộ mô phỏng — nhưng KHÔNG chạy lại hoạt ảnh: bố cục toàn
     kho đã nhớ, và đóng một popup thì không phải lúc bắt người ta chờ 6 giây. */
  datSoDo();
}

function htmlVanBan(v, i) {
  const ke = (S.ke.get(i) || []);
  return `<div class="doc">
    <div class="sh-lon">${esc(v.n)}</div>
    <h1>${esc(v.t)}</h1>
    <div style="margin:8px 0">${pillHL(v.e, "van_ban")}
      <span class="pill info">${esc(S.d.cap[v.c] || "Chưa xác định")}</span>
      <span class="pill unk">${v.p === "tw" ? "Toàn quốc" : "Địa phương"}</span></div>
    <table><tbody>
      <tr><th>Số hiệu</th><td><code>${esc(v.n)}</code></td></tr>
      <tr><th>Loại văn bản</th><td>${esc(v.l || "—")}</td></tr>
      <tr><th>Ngày ban hành</th><td>${esc(v.d || "—")}</td></tr>
      <tr><th>Lĩnh vực</th><td>${esc((S.d.linh_vuc.find(x => x.ma === v.f) || {}).ten || "—")}</td></tr>
      <tr><th>Tình trạng hiệu lực</th><td>${esc(nhanHL(v.e, "van_ban"))}</td></tr>
    </tbody></table>
    <div class="canh-bao"><b>Bản trích dữ kiện</b>Trang này chỉ hiện dữ kiện và quan hệ
      dẫn chiếu. Toàn văn và phụ lục nằm ở trang đầy đủ — bấm “Trang gốc”.</div>
    ${ke.length && TC.sodo
      ? `<h3>Vị trí trong mạng lưới (${ke.length} quan hệ trực tiếp)</h3>${htmlSoDo()}`
      : ""}
    ${htmlBieuMauKemTheo(v.n)}
  </div>`;
}

function htmlBieuMauKemTheo(soHieu) {
  const bm = S.d.bieu_mau.filter(b => (b.c || []).includes(soHieu));
  if (!bm.length) return "";
  return `<h3>Biểu mẫu kèm theo (${bm.length})</h3><ul>` + bm.map(b =>
    `<li><a href="#" data-mo-bm="${esc(b.k)}">${esc(b.t)}</a> ${pillHL(b.e, "bieu_mau")}</li>`
  ).join("") + "</ul>";
}

function htmlBieuMau(v) {
  const kieu = KIEU_HL[v.e] || "unk";
  return `<div class="doc">
    <div class="sh-lon">${esc(v.k)}</div>
    <h1>${esc(v.t)}</h1>
    ${v.g ? `<div class="canh-bao bad"><b>Nguồn đã gỡ biểu mẫu này</b>
      Thư viện Pháp luật không còn liệt kê nó — thường vì văn bản kèm theo đã bị
      thay thế. Bản lưu chỉ còn giá trị tra cứu, không nên dùng để nộp.</div>` : ""}
    <div class="canh-bao ${kieu === "ok" ? "ok" : kieu === "bad" ? "bad" : ""}">
      <b>${esc(nhanHL(v.e, "bieu_mau"))}</b>
      Biểu mẫu là phụ lục kèm theo văn bản quy phạm nên hiệu lực của nó theo hiệu
      lực của văn bản đó. Nguồn KHÔNG công bố dữ kiện này — nó được suy từ căn cứ.</div>
    <div class="tai-ve">
      ${v.g ? `<a href="${urlDrive(esc(v.g))}" target="_blank" rel="noopener">⬇ Bản Word (điền được)</a>`
             : v.w ? `<a href="${GOC}/bieu-mau/${esc(v.w)}" download>⬇ Bản Word (điền được)</a>` : ""}
      ${v.p ? `<a class="phu" href="${GOC}/bieu-mau/${esc(v.p)}" download>⬇ Bản PDF (để in)</a>` : ""}
    </div>
    <table><tbody>
      <tr><th>Nghiệp vụ</th><td>${(v.v || []).map(nv =>
        esc((S.d.nghiep_vu.find(x => x.ma === nv) || {}).ten || nv)).join(", ") || "—"}</td></tr>
      <tr><th>Căn cứ pháp lý</th><td>${(v.c || []).map(n => {
        const j = S.d.van_ban.findIndex(x => x.n === n);
        return j >= 0 ? `<a href="#" data-mo-vb="${j}"><code>${esc(n)}</code></a>`
                      : `<code>${esc(n)}</code> <em>(chưa có trong kho)</em>`;
      }).join("<br>") || "—"}</td></tr>
    </tbody></table>
    <div class="canh-bao"><b>Bản dựng lại</b>Nội dung đầy đủ và bản in nằm ở trang
      đầy đủ — bấm “Trang gốc”.</div>
  </div>`;
}

/* ════════════════ Sơ đồ lực trên canvas ════════════════

   Bản trước là SVG TĨNH: 26 láng giềng bậc 1 xếp đều trên một vòng tròn. Nó nói
   được "văn bản này nối với ai" nhưng không nói được điều quan trọng hơn — văn
   bản này NẰM Ở ĐÂU trong kho. Vòng tròn đều là bố cục do mình áp đặt, không
   phải hình dạng thật của quan hệ.

   Đây là mô phỏng lực, bố cục tự mọc ra từ chính các cạnh.

   VÌ SAO CANVAS CHỨ KHÔNG SVG. Đo trên chính kho này: 4.201 nút, 23.801 cạnh.
   SVG nghĩa là 28 nghìn phần tử DOM, mỗi khung hình phải cập nhật thuộc tính
   từng phần tử — đúng thứ khiến sơ đồ toàn cục của Quartz không mở nổi. Canvas
   vẽ cùng chừng ấy hình bằng vài lệnh path gộp.

   VÌ SAO PHẢI CÓ CÂY TỨ PHÂN. Lực đẩy là lực giữa MỌI CẶP nút: 4.201 nút thành
   17,6 triệu phép mỗi khung hình. Cây tứ phân Barnes–Hut gộp các nút ở xa thành
   một khối tâm, đưa xuống O(n log n) ≈ 50 nghìn phép. Không có nó thì chế độ
   toàn kho là bất khả thi chứ không phải chậm.
   ───────────────────────────────────────────────────────── */

const SD = {
  id: 0, cv: null, ctx: null, W: 0, H: 0, dpr: 1,
  goc: 0, ds: [], viTri: new Map(),
  x: null, y: null, vx: null, vy: null, bkinh: null, sau: null, huong: null,
  ca: null, cb: null, cung: null, lech: null,
  alpha: 0, cam: { x: 0, y: 0, z: 1 }, tro: -1, keo: -1, panh: null,
  toanKho: false, nhan: new Set(), tuTay: false, daDi: false, tam: null,
  tapChoSan: null, soTrichDan: 0, soCau: 0,
};

/* NGÂN SÁCH NÚT — 90, không phải 240.
   Không phải giới hạn tốc độ: đo được 1,0 ms mỗi bước cho 240 nút, thừa sức
   60 fps. Đây là giới hạn ĐỌC ĐƯỢC. Khung 638×360 với 240 nút và 1.200 cạnh
   cho ra một mảng xám đặc — bố cục đúng nhưng không nói được gì. 90 nút là mức
   còn phân biệt được từng nút và lần được từng cạnh. */
const SD_TRAN = 90;
/* θ = 1,5 (bình phương sẵn). d3 dùng 0,9 cho vài trăm nút; ở 4.170 nút thì
   0,9 tốn 36 ms mỗi bước — 22 fps, thấy giật. Nới θ là gộp sớm hơn, sai số bố
   cục lớn hơn nhưng ở cỡ này không ai đọc từng nút, người ta đọc hình dạng. */
const SD_THETA2 = 2.25;

/* ── Cây tứ phân, mảng phẳng ──
   Dựng lại MỖI khung hình: nút di chuyển liên tục nên cây cũ vô dụng. Dùng mảng
   phẳng cấp phát sẵn chứ không dùng đối tượng — 4.200 lần chèn × độ sâu ~12 là
   ~50 nghìn đối tượng mỗi khung hình, đủ để bộ dọn rác giật hình đều đặn. */
let qCon = new Int32Array(0), qX, qY, qM, qLa, qNua, qCx, qCy, qDem = 0;

function qCapPhat(n) {
  const c = Math.max(256, Math.ceil(n * 4));
  if (qCon.length >= c * 4) return;
  qCon = new Int32Array(c * 4); qX = new Float64Array(c); qY = new Float64Array(c);
  qM = new Float64Array(c); qLa = new Int32Array(c);
  qNua = new Float64Array(c); qCx = new Float64Array(c); qCy = new Float64Array(c);
}

function qO(cx, cy, nua) {
  /* Ghi vượt sức chứa của TypedArray KHÔNG ném lỗi — nó lặng lẽ bỏ qua, và cây
     thành ra sai lệch chứ không sập. Nới gấp đôi rồi dựng lại từ đầu là cách
     duy nhất để hỏng thành ồn ào. */
  if (qDem >= qX.length) { qCapPhat(qX.length * 2); throw new RangeError("cay-tran"); }
  const k = qDem++;
  qCon[k * 4] = qCon[k * 4 + 1] = qCon[k * 4 + 2] = qCon[k * 4 + 3] = -1;
  qX[k] = qY[k] = qM[k] = 0; qLa[k] = -1; qNua[k] = nua; qCx[k] = cx; qCy[k] = cy;
  return k;
}

function qChen(k, i, px, py, sau) {
  for (;;) {
    qX[k] += px; qY[k] += py; qM[k]++;
    const co = qCon[k * 4] >= 0;
    if (!co && qLa[k] < 0) { qLa[k] = i; return; }
    if (!co) {
      /* Ô lá đã có người: tách tư rồi đẩy CẢ HAI xuống. Chốt độ sâu 22 là để
         hai nút trùng toạ độ tuyệt đối không làm vòng lặp chia mãi không dừng —
         đã gặp khi hai văn bản khởi tạo cùng một điểm. */
      const cu = qLa[k]; qLa[k] = -1;
      if (sau > 22) { qLa[k] = cu; return; }
      const nua = qNua[k] / 2;
      for (let o = 0; o < 4; o++)
        qCon[k * 4 + o] = qO(qCx[k] + (o & 1 ? nua : -nua), qCy[k] + (o & 2 ? nua : -nua), nua);
      const oc = (SD.x[cu] > qCx[k] ? 1 : 0) | (SD.y[cu] > qCy[k] ? 2 : 0);
      qChen(qCon[k * 4 + oc], cu, SD.x[cu], SD.y[cu], sau + 1);
    }
    k = qCon[k * 4 + ((px > qCx[k] ? 1 : 0) | (py > qCy[k] ? 2 : 0))];
    sau++;
  }
}

/* SÀN KHOẢNG CÁCH: 0,3 px, và trần vận tốc mới là thứ giữ ổn định.
   Đã thử cả hai đầu và cả hai đều hỏng theo kiểu riêng:
     · sàn 1e-6 KHÔNG kèm trần vận tốc → hai nút chồng nhau sinh lực 3,8×10⁷,
       mạng bắn ra 10⁸ px ngay khung hình đầu;
     · sàn 2 px → lực đẩy ở cự ly gần hoá TUYẾN TÍNH theo dx, tức yếu dần về 0
       đúng lúc cần nó nhất. Mạng 240 nút co vào hộp 33 px rồi kẹt luôn ở đó,
       vì đến 2 px thì lực đẩy không còn đủ sức mở ra. Đo được nguyên quỹ đạo:
       279 → 97 → 48 → 33 và dừng.
   Nên: sàn chỉ để chống chia cho 0, còn chống nổ là việc của trần vận tốc. */
const SD_SAN2 = .09;

/* Dưới ngưỡng này thì tính lực đẩy CHÍNH XÁC từng cặp, trên thì dùng cây tứ
   phân. 400 nút = 160 nghìn cặp ≈ 0,9 ms, vẫn thừa cho 60 fps. */
const SD_CHINH_XAC = 400;

/* Duyệt bằng NGĂN XẾP TƯỜNG MINH, không đệ quy.
   Ở 4.170 nút, mỗi nút thăm hơn trăm ô; chi phí gọi hàm của JS nhân lên từng
   ấy lần là phần lớn thời gian. Ngăn xếp cấp phát một lần, dùng lại mọi bước. */
let qNgan = new Int32Array(4096);

function qDay(goc, i, luc) {
  const xi = SD.x[i], yi = SD.y[i];
  let dinh = 0;
  qNgan[dinh++] = goc;
  let vx = 0, vy = 0;
  while (dinh) {
    const k = qNgan[--dinh];
    const dx = qX[k] - xi, dy = qY[k] - yi;
    let d2 = dx * dx + dy * dy;
    if (d2 < SD_SAN2) d2 = SD_SAN2;
    const w = qNua[k] * 2;
    if (qCon[k * 4] < 0 || w * w < SD_THETA2 * d2) {
      if (qLa[k] === i && qM[k] === 1) continue;
      const f = luc * qM[k] / d2;
      vx -= dx * f; vy -= dy * f;
      continue;
    }
    if (dinh + 4 > qNgan.length) {
      const moi = new Int32Array(qNgan.length * 2);
      moi.set(qNgan); qNgan = moi;
    }
    for (let o = 0; o < 4; o++) {
      const c = qCon[k * 4 + o];
      if (qM[c]) qNgan[dinh++] = c;
    }
  }
  SD.vx[i] += vx; SD.vy[i] += vy;
}

/* ── Chọn tập nút ──
   Chế độ lân cận đi BFS từ văn bản đang mở. Vượt ngân sách thì cắt tầng ngoài
   theo BẬC GIẢM DẦN, giữ lại các đầu mối được dẫn chiếu nhiều — chúng là thứ
   định vị văn bản trong kho, còn nút bậc 1 cụt thì không nói thêm gì.
   Đo trên kho này: từ một văn bản bất kỳ, bậc 2 đã chạm trung vị 604 nút và
   bậc 3 là 3.142 — nên "toàn bộ kho" không phải một lựa chọn mặc định được. */
function sdChonNut(goc) {
  /* Tập nút CHO SẴN — dùng cho sơ đồ trích dẫn: chỉ đúng những văn bản mà câu
     trả lời dẫn ra, không mở rộng láng giềng. Mở rộng thì sơ đồ nói về kho chứ
     không nói về câu trả lời nữa. */
  if (SD.tapChoSan) {
    const ds = SD.tapChoSan.filter(g => g !== goc);
    ds.unshift(goc);
    /* Bậc 0 = tâm, 1 = văn bản được trích dẫn, 2 = văn bản trung gian. Bậc quyết
       định màu, nên trung gian phải khác hẳn — nó KHÔNG nằm trong câu trả lời,
       nó chỉ giải thích đường nối. */
    const sc = SD.soTrichDan || ds.length;
    return { ds, sau: new Map(ds.map((g, k) => [g, k === 0 ? 0 : k < sc ? 1 : 2])) };
  }
  if (SD.toanKho) {
    /* Duyệt rộng từ văn bản đang mở để lấy BẬC THẬT của mọi nút, rồi gieo vị trí
       theo bậc đó. Gieo theo xoắn ốc tuỳ tiện thì hai nút có cạnh nối nhau nằm ở
       hai đầu đĩa, và mô phỏng phải kéo chúng đi hàng trăm px — đo được: sau khi
       lắng xong, chiều dài cạnh trung vị vẫn bằng 81% bán kính đồ thị, tức bố
       cục gần như vẫn là cái xoắn ốc ban đầu. Gieo theo bậc thì nút nối nhau đã
       nằm cạnh nhau ngay từ đầu, mô phỏng chỉ còn việc chỉnh cục bộ.
       `sau` cũng là thứ quyết định tô màu, nên chỉ 0/1 mới là láng giềng trực
       tiếp; các bậc xa hơn dùng cho việc gieo. */
    const ds = [], sau = new Map([[goc, 0]]);
    let vien = [goc];
    for (let d = 1; vien.length; d++) {
      const nxt = [];
      for (const u of vien)
        for (const [v] of (S.ke.get(u) || []))
          if (!sau.has(v)) { sau.set(v, d); nxt.push(v); }
      vien = nxt;
    }
    for (let i = 0; i < S.d.van_ban.length; i++)
      if (S.ke.has(i) || i === goc) { ds.push(i); if (!sau.has(i)) sau.set(i, 99); }
    return { ds, sau };
  }
  /* CHỈ BẬC 1 — đúng những văn bản dẫn chiếu tới hoặc bị văn bản này dẫn chiếu.
     Bản trước lấy hết bậc 1 rồi đệm thêm bậc 2 cho đủ 90 nút, và phần đệm ấy
     chọn theo BẬC GIẢM DẦN nên nó toàn kéo về các đầu mối lớn của kho. Kết quả:
     96/2024/NĐ-CP có 14 quan hệ trực tiếp mà sơ đồ vẽ 90 nút, trong đó 76 nút
     không liên quan gì tới nó — chúng chỉ là hàng xóm của hàng xóm, được chọn
     vì to. Sơ đồ nói về kho chứ không nói về văn bản đang mở.
     Muốn thấy vùng rộng hơn thì có nút "Xem toàn kho" ngay cạnh. */
  const sau = new Map([[goc, 0]]), ds = [goc];
  const lang = [...new Set((S.ke.get(goc) || []).map(([v]) => v))];
  /* Vẫn chặn trần: văn bản trung tâm có tới 889 quan hệ trực tiếp, và 889 nút
     trong khung 638×360 là một vành đặc không đọc được. Cắt thì cắt theo bậc
     giảm dần — giữ lại các văn bản có sức nặng trong kho. */
  if (lang.length > SD_TRAN)
    lang.sort((a, b) => (S.ke.get(b) || []).length - (S.ke.get(a) || []).length);
  for (const v of lang.slice(0, SD_TRAN)) { sau.set(v, 1); ds.push(v); }
  return { ds, sau };
}

/* `boQuaNho`: bỏ qua bố cục đã nhớ và dựng lại từ đầu.
   Dùng khi người dùng TỰ bấm đổi phạm vi — lúc đó họ muốn xem mạng lưới được
   dựng ra, không phải thấy nó hiện sẵn. Còn khi chỉ mở một văn bản khác trong
   cùng phạm vi thì dùng lại bố cục nhớ, vì bố cục không đổi mà chờ lắng lại 6
   giây là chờ vô ích. */
function sdDung(goc, boQuaNho) {
  const { ds, sau } = sdChonNut(goc);
  const n = ds.length;
  SD.goc = 0; SD.ds = ds;
  SD.viTri = new Map(ds.map((g, k) => [g, k]));
  const k0 = SD.viTri.get(goc);
  if (k0 > 0) {   /* văn bản đang mở luôn là chỉ số 0, để vẽ sau cùng và nằm trên */
    ds[k0] = ds[0]; ds[0] = goc;
    SD.viTri = new Map(ds.map((g, k) => [g, k]));
  }

  SD.x = new Float64Array(n); SD.y = new Float64Array(n);
  SD.vx = new Float64Array(n); SD.vy = new Float64Array(n);
  SD.bkinh = new Float64Array(n); SD.sau = new Uint8Array(n); SD.huong = new Int8Array(n);

  const lang = new Map((S.ke.get(goc) || []).map(([j, , h]) => [j, h]));

  /* THỨ HẠNG theo bậc, rồi gieo trên xoắn ốc r = C·√hạng.
     Bản trước gieo mỗi bậc lên MỘT VÒNG bán kính riêng. Nghe hợp lý cho tới khi
     gặp một văn bản mà phân bố bậc lệch hẳn: 01/2007/QH12 có 6 láng giềng trực
     tiếp, và 4.163 nút còn lại đều ở bậc 2 — tất cả bị dồn lên một vòng bán kính
     126, chu vi 792, tức cách nhau 0,19 đơn vị. Dưới sàn khoảng cách 0,09 thì
     lực đẩy hoá tuyến tính và yếu dần về 0, nên mạng KHÔNG mở ra được: đo bán
     kính trung vị 5 trên bán kính lớn nhất 442 — 4.163 nút chồng thành một chấm,
     và trên màn hình chỉ còn thấy chừng 25 nút.
     r = C·√hạng cho mật độ đều trên cả đĩa, mà hạng vẫn đi theo thứ tự bậc nên
     nút nối nhau vẫn ở gần nhau. */
  const hang = new Int32Array(n);
  {
    const thuTu = [...Array(n).keys()]
      .sort((a, b) => (sau.get(ds[a]) ?? 99) - (sau.get(ds[b]) ?? 99) || a - b);
    for (let r = 0; r < n; r++) hang[thuTu[r]] = r;
  }

  for (let k = 0; k < n; k++) {
    const g = ds[k], d = sau.get(g) ?? 2;
    SD.sau[k] = Math.min(d, 2);
    SD.huong[k] = k === 0 ? 0 : (lang.get(g) || 0);
    const deg = (S.ke.get(g) || []).length;
    /* Bán kính theo CHẾ ĐỘ. Cùng một cỡ nút, 90 nút thì vừa mắt còn 4.170 nút
       thành một mảng đặc không thấy khe hở nào — số nút gấp 46 lần thì diện
       tích mỗi nút phải nhỏ đi tương ứng. */
    SD.bkinh[k] = SD.toanKho
      ? (k === 0 ? 5 : Math.min(3.4, 1.1 + Math.sqrt(deg) * .2))
      : (k === 0 ? 7.5 : Math.min(7, 2.3 + Math.sqrt(deg) * .5));
    /* Gieo vị trí THEO CHỈ SỐ, không theo ngẫu nhiên: mở lại cùng một văn bản
       phải ra cùng một hình. Bố cục đổi mỗi lần mở thì không ai nhận ra nổi
       vùng nào là vùng nào. */
    const g1 = k * 2.39996;
    const r0 = k === 0 ? 0 : SD.toanKho
      ? 15 * Math.sqrt(hang[k])
      : 16 + Math.sqrt(k) * (d === 1 ? 7 : 12);
    SD.x[k] = Math.cos(g1) * r0; SD.y[k] = Math.sin(g1) * r0;
  }

  const ca = [], cb = [];
  for (const [a, b] of S.d.do_thi.canh) {
    const i = SD.viTri.get(a), j = SD.viTri.get(b);
    if (i !== undefined && j !== undefined && i !== j) { ca.push(i); cb.push(j); }
  }
  SD.ca = new Int32Array(ca); SD.cb = new Int32Array(cb);

  /* Độ cứng lò xo CHIA THEO BẬC, và độ lệch chia phần dịch chuyển giữa hai đầu.
     Đây là chỗ bản đầu sai và cho ra một cục tròn đặc: mỗi cạnh kéo bằng một
     lực như nhau, nên nút có 200 cạnh bị kéo mạnh gấp 200 lần nút có 1 cạnh —
     mọi thứ sập vào các đầu mối. Chia cho bậc NHỎ HƠN trong hai đầu là cách
     d3-force làm, và nó chính là thứ khiến bố cục xoè ra thành hình đọc được.
     Độ lệch để nút bậc thấp dịch nhiều hơn: cái đuôi phải quay quanh cái đầu,
     không phải ngược lại. */
  const bac = new Int32Array(n);
  for (let e = 0; e < SD.ca.length; e++) { bac[SD.ca[e]]++; bac[SD.cb[e]]++; }
  SD.cung = new Float64Array(SD.ca.length);
  SD.lech = new Float64Array(SD.ca.length);
  for (let e = 0; e < SD.ca.length; e++) {
    const i = SD.ca[e], j = SD.cb[e];
    SD.cung[e] = 1 / Math.min(bac[i] || 1, bac[j] || 1);
    SD.lech[e] = bac[i] / ((bac[i] || 1) + (bac[j] || 1));
  }

  /* Nhãn chỉ hiện cho văn bản đang mở và các đầu mối lớn nhất. Vẽ 4.200 nhãn
     là 4.200 lần đo chữ mỗi khung hình, và kết quả là một mảng chữ chồng nhau
     không đọc được — đắt gấp đôi mà tệ hơn. */
  /* Ứng viên nhãn: các đầu mối lớn nhất. Vẽ hết 4.200 nhãn là 4.200 lần đo chữ
     mỗi khung hình, cho ra một mảng chữ chồng nhau — đắt gấp bội mà tệ hơn.
     Ai thật sự được vẽ thì do phép kiểm chồng lấn trong sdVe quyết. */
  SD.nhan = new Set(
    [...Array(n).keys()].slice(1)
      .sort((a, b) => SD.bkinh[b] - SD.bkinh[a])
      .slice(0, SD.toanKho ? 40 : 30));

  SD.alpha = 1; SD.cam = { x: 0, y: 0, z: 1 }; SD.tro = -1; SD.keo = -1; SD.tuTay = false;
  qCapPhat(n * 2);

  /* BỐ CỤC TOÀN KHO NHỚ LẠI GIỮA CÁC LẦN MỞ.
     Nó KHÔNG phụ thuộc văn bản nào đang mở — cùng 4.170 nút, cùng 23.801 cạnh,
     chỉ đổi cái được tô sáng. Mà lắng nó mất khoảng 6 giây ở ~30 fps, nên tính
     lại mỗi lần mở một văn bản là bắt người dùng ngồi xem lại đúng cái hoạt
     ảnh ấy. Lần đầu lắng thật và có hoạt ảnh; từ lần sau hiện ra ngay.
     Chỉ nhớ chế độ toàn kho: bố cục lân cận khác nhau theo từng văn bản. */
  if (SD.toanKho && S.boCucKho && !boQuaNho) {
    /* Đánh số theo CHỈ SỐ TOÀN CỤC của văn bản, không theo chỉ số cục bộ trong
       SD.ds. Thứ tự cục bộ đổi mỗi lần mở, vì văn bản đang mở luôn bị hoán về
       vị trí 0 — nhớ theo chỉ số cục bộ là mỗi lần mở lại hoán vị hai nút, đủ
       để bố cục "nhớ lại" thành bố cục của một kho khác. */
    for (let k = 0; k < n; k++) {
      const g = SD.ds[k] * 2;
      SD.x[k] = S.boCucKho[g]; SD.y[k] = S.boCucKho[g + 1];
    }
    SD.alpha = 0;
  }
}

/* CHẠY NÓNG trước khi vẽ khung đầu, có HẠN MỨC THỜI GIAN.
   Không có nó thì khung đầu là hình xoắn ốc gieo sẵn — một vòng ốc đều tăm tắp
   chẳng liên quan gì tới quan hệ thật, và người xem nhìn thấy nó trước khi nhìn
   thấy đồ thị. Hạn mức chứ không phải số bước cố định: một bước ở chế độ lân cận
   tốn 0,4 ms còn ở chế độ toàn kho tốn 21 ms — cùng 40 bước là 16 ms với cái
   này và 0,8 giây với cái kia.
   40 bước chứ không phải 90: chạy nóng nhiều quá thì mạng gần như đã lắng xong
   trước khi người dùng nhìn thấy, và hoạt ảnh chỉ còn cái đuôi. */
function sdNong() {
  if (!SD.alpha) return;   /* bố cục nhớ lại thì đã ở thế cân bằng, chạy nữa là phí */
  const han = performance.now() + 110;
  for (let k = 0; k < 40 && performance.now() < han; k++) { sdBuoc(); sdVua(); }
}

function sdBuoc() {
  const n = SD.ds.length;
  if (!n) return;
  const a = SD.alpha;
  /* Thang lực lấy theo d3-force: lực đẩy ~ -30/d². Hằng số lớn hơn một bậc là
     đủ để MỘT bước đẩy nút ra 1.500 px — mạng nổ tung ngay khung hình đầu và
     khung nhìn chỉ còn nền trống. Đã đo đúng như vậy khi để -620.
     Mạng lớn cần lực đẩy NHỎ hơn: tổng lực dồn lên mỗi nút tăng theo số nút. */
  /* Hằng số đo bằng cách quét, không phải chép từ d3. Đồ thị này DÀY hơn đồ thị
     mẫu của d3 nhiều — bậc trung bình 10,7 — nên độ cứng lò xo cộng dồn lớn hơn
     hẳn và lực đẩy phải theo kịp. Quét trên 96/2024/NĐ-CP: lực 46 cho bao đóng
     41 px (đặc quánh), 120 → 63, 300 → 114, 600 → 148. */
  const luc = -(SD.toanKho ? 40 : 300) * a;
  /* Chiều dài lò xo giãn theo SỐ NÚT. Với hằng số cố định, mạng hình sao —
     96/2024/NĐ-CP có 239 quan hệ trực tiếp, tức 239 lá quanh một tâm — xếp
     thành vòng bán kính đúng bằng chiều dài lò xo, ra một đốm 80 px bất kể
     khung rộng bao nhiêu. Vòng phải đủ chu vi cho ngần ấy lá. */
  const dai = SD.toanKho ? 30 : 40, loxo = a;

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < n; i++) {
    if (SD.x[i] < x0) x0 = SD.x[i]; if (SD.x[i] > x1) x1 = SD.x[i];
    if (SD.y[i] < y0) y0 = SD.y[i]; if (SD.y[i] > y1) y1 = SD.y[i];
  }
  /* MẠNG NHỎ TÍNH CHÍNH XÁC, KHÔNG XẤP XỈ.
     Cây tứ phân gộp các nút ở xa thành một khối tâm — nhanh, nhưng khi một nút
     đi qua ranh giới ô thì tập ô được gộp ĐỔI ĐỘT NGỘT và lực nhảy một bậc. Ở
     4.170 nút không ai thấy; ở 90 nút thì thấy rõ từng nút giật. Mà 90 nút chỉ
     là 8.100 cặp, rẻ hơn cả việc dựng cây — xấp xỉ ở đây là trả tiền để mua sự
     giật. */
  if (n <= SD_CHINH_XAC) {
    for (let i = 0; i < n; i++) {
      if (i === SD.keo) continue;
      const xi = SD.x[i], yi = SD.y[i];
      let vx = 0, vy = 0;
      for (let j = 0; j < n; j++) {
        if (j === i) continue;
        const dx = SD.x[j] - xi, dy = SD.y[j] - yi;
        let d2 = dx * dx + dy * dy;
        if (d2 < SD_SAN2) d2 = SD_SAN2;
        const f = luc / d2;
        vx -= dx * f; vy -= dy * f;
      }
      SD.vx[i] += vx; SD.vy[i] += vy;
    }
  } else {
  const nua = Math.max(x1 - x0, y1 - y0, 1) / 2 + 1;
  let goc;
  for (let lan = 0; lan < 3; lan++) {
    try {
      qDem = 0;
      goc = qO((x0 + x1) / 2, (y0 + y1) / 2, nua);
      for (let i = 0; i < n; i++) qChen(goc, i, SD.x[i], SD.y[i], 0);
      break;
    } catch (err) {
      if (err.message !== "cay-tran" || lan === 2) return;
    }
  }
  /* Chuyển TỔNG toạ độ thành KHỐI TÂM ngay sau khi dựng cây, một lần cho mỗi ô.
     Để nguyên tổng thì mỗi lần thăm một ô phải chia hai lần, mà số lần thăm là
     hàng trăm nghìn mỗi bước — phép chia là thứ đắt nhất trong vòng trong. */
  for (let k = 0; k < qDem; k++) { const m = qM[k]; if (m) { qX[k] /= m; qY[k] /= m; } }
  for (let i = 0; i < n; i++) if (i !== SD.keo) qDay(goc, i, luc);
  }

  for (let e = 0; e < SD.ca.length; e++) {
    const i = SD.ca[e], j = SD.cb[e];
    /* Khoảng cách tính trên vị trí DỰ BÁO (đã cộng vận tốc hiện thời), đúng
       cách d3-force làm. Tính trên vị trí hiện tại thì lò xo luôn phản ứng
       CHẬM một bước so với chuyển động đang có, và hệ dao động: đo được quỹ đạo
       121 → 89 → 115 → 51 → 19 → 42 rồi nảy quanh đó, thay vì lắng dần. */
    let dx = SD.x[j] + SD.vx[j] - SD.x[i] - SD.vx[i];
    let dy = SD.y[j] + SD.vy[j] - SD.y[i] - SD.vy[i];
    let d = Math.max(Math.hypot(dx, dy), .5);
    const f = (d - dai) / d * loxo * SD.cung[e], b = SD.lech[e];
    /* Đầu nào BẬC CAO thì dịch ÍT. `lech[e]` là tỉ phần bậc của i, nên i phải
       nhận (1 − lech) còn j nhận lech. Đảo hai vế là mỗi đầu mối bị cả trăm cạnh
       giật mạnh nhất, và cả mạng sập vào một điểm — đo được 34×34 px cho 240 nút
       khi để nhầm chiều. */
    dx *= f; dy *= f;
    if (i !== SD.keo) { SD.vx[i] += dx * (1 - b); SD.vy[i] += dy * (1 - b); }
    if (j !== SD.keo) { SD.vx[j] -= dx * b; SD.vy[j] -= dy * b; }
  }

  /* GỠ CHỒNG LẤN — chỉ ở mạng nhỏ, và đây là thứ tạo ra dáng TRÒN GÓI ĐỀU.
     Lực đẩy 1/d² giữ các nút xa nhau về trung bình nhưng không cấm hai nút nằm
     đè lên nhau; chỗ đè đó là cái mắt đọc thành "một cục lổn nhổn" thay vì một
     đĩa gói đều. Đẩy nhau đúng bằng phần chồng, mỗi bên một nửa: cục bộ, không
     kéo theo phần còn lại, nên nó gói chặt mà không làm mạng phồng lên.
     Bán kính tính bằng ĐƠN VỊ THẾ GIỚI, KHÔNG chia cho độ phóng. Chia cho độ
     phóng nghe có lý — thứ không được đè nhau là hình trên màn hình — nhưng nó
     tạo một vòng phản hồi: phóng to → bán kính thế giới nhỏ đi → mạng co lại →
     khung nhìn lại phóng to hơn, chạy tới khi đụng trần phóng. Đo được: lấp
     31% bề rộng khung và độ phóng kẹt ở trần.
     Mà hằng số này không ảnh hưởng hình cuối: bao đóng tỉ lệ thuận với bán kính,
     còn độ phóng tự vừa thì tỉ lệ nghịch — hai cái triệt tiêu nhau. */
  if (n <= SD_CHINH_XAC) {
    for (let i = 0; i < n; i++) {
      const ri = SD.bkinh[i] + 2.5;
      for (let j = i + 1; j < n; j++) {
        const tt = ri + SD.bkinh[j] + 2.5;
        let dx = SD.x[j] - SD.x[i], dy = SD.y[j] - SD.y[i];
        const d2 = dx * dx + dy * dy;
        if (d2 >= tt * tt || d2 < 1e-9) continue;
        const d = Math.sqrt(d2), day = (tt - d) / d * .5;
        dx *= day; dy *= day;
        if (i !== SD.keo && i !== 0) { SD.x[i] -= dx; SD.y[i] -= dy; }
        if (j !== SD.keo) { SD.x[j] += dx; SD.y[j] += dy; }
      }
    }
  }

  /* Văn bản đang mở GHIM tại gốc toạ độ, không thả trôi.
     Bố cục lực không có toạ độ tuyệt đối — ghim một nút không làm sai cấu trúc,
     nó chỉ chọn hệ quy chiếu. Đổi lại, khung nhìn luôn biết đặt tâm ở đâu, và
     câu hỏi mà cả sơ đồ này sinh ra để trả lời — "văn bản này nằm ở đâu" — có
     một chỗ cố định để nhìn. Thả trôi thì nó dạt ra rìa, và người xem phải đi
     tìm chính thứ mình đang đọc. */
  SD.x[0] = SD.y[0] = SD.vx[0] = SD.vy[0] = 0;
  /* Bộ ba (lực đẩy, lực về tâm, chiều dài lò xo) của chế độ toàn kho quét trên
     4.170 nút, chấm bằng tỉ lệ nút nằm trong 40% bán kính — đĩa phân bố đều cho
     ~16%, vành khuyên rỗng ruột cho ~0:
        đẩy 150 · tâm .055  →  1,9%   vành khuyên rõ, lỗ giữa to
        đẩy  40 · tâm .020  → 12,9%   gần đều  ← chọn
        đẩy  12 · tâm .006  → 22,5%   dồn cục vào giữa
     Và một bờ vực: đẩy quá yếu so với lò xo thì cả mạng sập vào bán kính 14 —
     xảy ra ở (40, .055), (12, .02) và (4, .004). */
  const veTam = (SD.toanKho ? .02 : .011) * a;
  /* TRẦN VẬN TỐC CO THEO ALPHA — chốt chính quyết định mạng chuyển động NHANH
     hay CHẬM. Đo dịch chuyển trung bình / đỉnh mỗi nút mỗi khung hình trên đồ
     thị 96/2024/NĐ-CP, chạy tới khi alpha về 0:
        1,50 + 23,0·α  → 11,15 px  đỉnh 96,1  lắng 2,8 s   quá nhanh
        0,40 +  3,5·α  →  1,32 px  đỉnh 11,0  lắng 5,7 s   vẫn còn nhanh
        0,28 +  2,2·α  →  0,35 px  đỉnh  5,1  lắng 7,5 s   ← chọn
        0,20 +  1,6·α  →  0,10 px  đỉnh  1,3  lắng 9,3 s   gần như đứng yên
     Chậm KHÔNG đồng nghĩa lâu, và đây là chỗ dễ trộn lẫn: thời gian lắng do tốc
     độ nguội của alpha định, còn trần chỉ định mỗi khung hình đi được bao xa.
     Hai thứ chỉnh riêng.
     TRẦN TÍNH BẰNG PIXEL TRÊN MÀN HÌNH, không phải đơn vị thế giới — chia cho
     độ phóng hiện thời. Thang thế giới là thang của MÔ HÌNH; thứ mắt đọc là
     thang MÀN HÌNH, và chốt ở thang màn hình thì nó tự thích ứng theo độ phóng
     và cỡ khung.

     ĐÍCH: 1,08 px mỗi nút mỗi khung hình, đo trên cả hai phạm vi.

     Vẫn phải có HAI hằng số, và lý do đáng ghi lại: trần chỉ CHẶN chứ không đẩy.
     Mạng 90 nút thưa nên lực trên mỗi nút lớn, nó chạm trần gần như mọi bước —
     ở đó trần là thứ quyết định tốc độ. Mạng 4.170 nút thì lực nhỏ, trần gần
     như không chạm tới — ở đó tốc độ do lực quyết định, và phải siết trần xuống
     tận nơi nó mới có tác dụng. Đo được, cùng một trần cho cả hai:
        trần 0,50 + 4,0·α   lân cận 0,22   toàn kho 1,24
        trần 0,90 + 7,0·α   lân cận 0,91   toàn kho 2,23
        trần 1,50 + 13·α    lân cận 3,45   toàn kho    —
     Hai đường cong khác độ dốc, nên một hằng số không thể đưa cả hai về 1,08.
     Chốt riêng: lân cận 0,95 + 7,4·α → 1,09; toàn kho 0,45 + 3,5·α → 1,11. */
  const tran = (SD.toanKho ? .45 + 3.5 * a : .95 + 7.4 * a)
    / Math.max(SD.cam.z, 1e-3), tran2 = tran * tran;
  for (let i = 1; i < n; i++) {
    SD.vx[i] -= SD.x[i] * veTam; SD.vy[i] -= SD.y[i] * veTam;
    if (i === SD.keo) { SD.vx[i] = SD.vy[i] = 0; continue; }
    SD.vx[i] *= .5; SD.vy[i] *= .5;
    const v2 = SD.vx[i] * SD.vx[i] + SD.vy[i] * SD.vy[i];
    if (v2 > tran2) { const s = tran / Math.sqrt(v2); SD.vx[i] *= s; SD.vy[i] *= s; }
    SD.x[i] += SD.vx[i]; SD.y[i] += SD.vy[i];
  }
  /* Tốc độ NGUỘI định thời gian lắng: 0,014 cho ~376 khung hình ≈ 6,3 giây ở
     60 fps. Cùng một giá trị cho hai phạm vi, cùng lý do như trần vận tốc. */
  const nguoi = .014;
  SD.alpha = a > .006 ? a - (a - .0015) * nguoi : 0;
  if (!SD.alpha && SD.toanKho) {
    if (!S.boCucKho) S.boCucKho = new Float64Array(S.d.van_ban.length * 2);
    for (let k = 0; k < n; k++) {
      const g = SD.ds[k] * 2;
      S.boCucKho[g] = SD.x[k]; S.boCucKho[g + 1] = SD.y[k];
    }
  }
}

function sdMau(k, mo) {
  if (k === 0) return mo;
  if (SD.sau[k] === 1) return SD.huong[k] > 0 ? SD.cAccent : SD.cDo;
  return SD.cMo;
}

/* Khung nhìn TỰ VỪA trong lúc mạng còn đang giãn.
   Không có nó thì mọi hằng số lực phải chỉnh tay cho vừa đúng 638×360 — mà kích
   thước đó đổi theo bề rộng cửa sổ, và mạng 240 nút với mạng 4.170 nút giãn ra
   hai cỡ khác hẳn nhau. Đo bao đóng rồi đặt độ phóng là cách duy nhất đúng cho
   cả hai. Người dùng vừa chạm vào khung nhìn là dừng, không giành tay lái. */
/* Khớp tức thì, dùng lúc khởi tạo và khi đổi phạm vi. */
function sdVuaNgay() {
  for (let k = 0; k < 60; k++) sdVua();
}

function sdVua() {
  if (SD.tuTay || !SD.ds.length) return;
  const n = SD.ds.length;
  /* Khớp theo PHÂN VỊ 97, không theo nút xa nhất.
     Đồ thị này có đuôi dài: đo phân vị bán kính ở chế độ toàn kho —
        p50 54 · p90 163 · p95 242 · p98 332 · p99 453 · lớn nhất 1.414
     Khoảng 1% nút (≈42 cái, hầu hết thuộc các cụm rời không nối vào phần chính)
     nằm ngoài 453 trong khi 90% nằm trong 163. Khớp theo nút xa nhất là để MỘT
     nút quyết định độ phóng cho 4.170 nút: phần đông co lại còn 12% khung — đúng
     cái đốm nhỏ nhìn thấy trên ảnh chụp.
     Đổi lại, vài nút ở đuôi nằm ngoài khung; lăn chuột ra là thấy. Với mạng lân
     cận 90 nút thì không có đuôi nên p97 ≈ nút xa nhất, hành vi không đổi. */
  if (!SD.tam || SD.tam.length !== n) SD.tam = new Float64Array(n);
  const t = SD.tam;
  for (let i = 0; i < n; i++) t[i] = SD.x[i];
  t.sort();
  const q = Math.max(1, Math.round(n * .015));
  let x0 = t[q - 1], x1 = t[n - q];
  for (let i = 0; i < n; i++) t[i] = SD.y[i];
  t.sort();
  let y0 = t[q - 1], y1 = t[n - q];
  /* Lề co theo cỡ khung. 30 px cố định là 5% của khung nền 650 px nhưng tới
     14% của khung trích dẫn 213 px — cùng một con số, hai ý nghĩa khác hẳn. */
  const le = Math.max(10, Math.min(30, Math.min(SD.W, SD.H) * .1));
  /* Bao đóng đo ĐỐI XỨNG QUANH GỐC, không phải hộp bao thật. Nút đang mở được
     ghim ở gốc, nên lấy tâm hộp bao thật là đặt trọng tâm đám mây vào giữa
     khung và đẩy chính văn bản đang đọc ra rìa — đã thấy đúng như vậy.
     Trần phóng 6, không phải 2,2: mạng dày co lại thành đốm nhỏ, trần thấp khoá
     luôn nó ở đó — bố cục đúng mà khung nhìn không cho xem. */
  /* Vừa theo HỘP BAO THẬT. Bản trước đo đối xứng quanh gốc để nút được ghim
     luôn nằm giữa — nhưng khi bố cục toàn kho được nhớ lại thì không có bước
     lắng nào ghim nó cả, nó nằm đâu đó trong đám mây, và hộp đối xứng hoá ra
     to gấp đôi hộp thật: mạng co lại còn nửa khung. Hộp thật thì luôn lấp đầy,
     mà nút đang mở vẫn nằm trong khung vì hộp bao chứa mọi nút.
     Trần phóng 40, không phải 6: thang toạ độ của bố cục lực là tuỳ ý, mọi trần
     thấp đều có ngày thành ràng buộc và để mạng lọt thỏm giữa khung. */
  /* Tâm khung đặt NỬA ĐƯỜNG giữa tâm hộp bao và gốc toạ độ (chỗ ghim văn bản
     đang mở). Lấy hẳn tâm hộp thì văn bản đang đọc lệch khỏi giữa khung 91 px —
     vẫn trong khung, nhưng "văn bản này nằm ở đâu" đọc rõ hơn khi nó ở giữa.
     Lấy hẳn gốc thì hộp phải mở đối xứng và mạng co lại còn nửa khung.
     Nửa đường: nửa vòng bao vẫn tính từ tâm ĐÃ CHỌN nên không nút nào bị cắt. */
  /* Sơ đồ trích dẫn lấy ĐÚNG tâm hộp bao, không dung hoà về gốc. Việc dung hoà
     có ý nghĩa khi nút ghim là văn bản người dùng đang đọc — phải giữ nó gần
     giữa khung. Ở đây nút ghim chỉ là cái nối nhiều nhất trong tập, không có
     vai trò riêng, nên đổi nửa khung trống lấy nó là lỗ. */
  const gh = SD.tapChoSan ? 2 : 4;
  const cxw = (x0 + x1) / gh, cyw = (y0 + y1) / gh;
  const hx = Math.max(cxw - x0, x1 - cxw, 1), hy = Math.max(cyw - y0, y1 - cyw, 1);
  const z = Math.min(40, Math.max(.02,
    Math.min((SD.W - le * 2) / (hx * 2), (SD.H - le * 2) / (hy * 2))));
  const cx = -cxw * z, cy = -cyw * z;
  /* Nội suy chứ không gán thẳng: gán thẳng thì mỗi khung hình khung nhìn giật
     một nấc theo nút bay xa nhất, nhìn như hình bị rung. */
  /* Bám tới cùng rồi SNAP. Nội suy 16% mỗi khung hình chỉ tiệm cận chứ không
     bao giờ chạm đích — mà trước đây hàm này chỉ chạy khi alpha còn dương, nên
     alpha về 0 là khung nhìn đóng băng ở chỗ còn dở, thường lệch 10–20%. Đó
     đúng là lý do phải lăn chuột chỉnh tay sau mỗi lần mở. */
  /* Nội suy 7% chứ không 16%. Khung nhìn co giãn cũng là chuyển động mà mắt
     đọc được — bám nhanh thì cả mạng như bị giật vào chỗ ngay khung hình đầu,
     đúng phần đỉnh 13 px đo được trong bảng ở sdBuoc. */
  const k = .07;
  SD.cam.z += (z - SD.cam.z) * k;
  SD.cam.x += (cx - SD.cam.x) * k;
  SD.cam.y += (cy - SD.cam.y) * k;
  if (Math.abs(z - SD.cam.z) < z * .004) SD.cam.z = z;
  if (Math.abs(cx - SD.cam.x) < .5) SD.cam.x = cx;
  if (Math.abs(cy - SD.cam.y) < .5) SD.cam.y = cy;
}

function sdVe() {
  const c = SD.ctx, n = SD.ds.length;
  if (!c) return;
  c.setTransform(SD.dpr, 0, 0, SD.dpr, 0, 0);
  c.clearRect(0, 0, SD.W, SD.H);
  const z = SD.cam.z, ox = SD.W / 2 + SD.cam.x, oy = SD.H / 2 + SD.cam.y;
  const X = i => SD.x[i] * z + ox, Y = i => SD.y[i] * z + oy;

  const noi = SD.tro >= 0 ? SD.tro : (SD.keo >= 0 ? SD.keo : -1);
  const ke = new Set();
  if (noi >= 0) for (let e = 0; e < SD.ca.length; e++) {
    if (SD.ca[e] === noi) ke.add(SD.cb[e]);
    if (SD.cb[e] === noi) ke.add(SD.ca[e]);
  }

  /* Cạnh vẽ thành MỘT path gộp rồi stroke một lần. 23.801 lệnh stroke riêng lẻ
     là 23.801 lần đổi trạng thái ngữ cảnh — chỗ tốn nhất của cả khung hình. */
  c.lineWidth = 1;
  c.strokeStyle = SD.cCanh;
  c.globalAlpha = SD.toanKho ? .1 : .26;
  c.beginPath();
  for (let e = 0; e < SD.ca.length; e++) {
    const i = SD.ca[e], j = SD.cb[e];
    if (noi >= 0 && (i === noi || j === noi)) continue;
    c.moveTo(X(i), Y(i)); c.lineTo(X(j), Y(j));
  }
  c.stroke();

  if (noi >= 0) {
    c.globalAlpha = .95; c.strokeStyle = SD.cAccent; c.lineWidth = 1.4;
    c.beginPath();
    for (let e = 0; e < SD.ca.length; e++) {
      const i = SD.ca[e], j = SD.cb[e];
      if (i !== noi && j !== noi) continue;
      c.moveTo(X(i), Y(i)); c.lineTo(X(j), Y(j));
    }
    c.stroke();
  }

  c.globalAlpha = 1;
  for (let k = n - 1; k >= 0; k--) {
    const r = SD.bkinh[k] * Math.min(1.25, Math.max(.75, z));
    const sang = noi < 0 || k === noi || ke.has(k);
    c.globalAlpha = sang ? 1 : .3;
    c.fillStyle = sdMau(k, SD.cGoc);
    c.beginPath(); c.arc(X(k), Y(k), r, 0, 6.2832); c.fill();
    if (k === 0 || k === noi) {
      c.lineWidth = 2; c.strokeStyle = SD.cNen; c.stroke();
      c.lineWidth = 1.6; c.strokeStyle = k === 0 ? SD.cGoc : SD.cAccent;
      c.beginPath(); c.arc(X(k), Y(k), r + 3.5, 0, 6.2832); c.stroke();
    }
  }

  c.globalAlpha = 1;
  const chuFont = getComputedStyle(document.body).fontFamily;
  c.textAlign = "center";
  const hienNhan = z > .55;
  /* Nhãn nào ĐÈ lên nhãn đã vẽ thì bỏ. Chỉ giới hạn theo SỐ LƯỢNG là không đủ:
     trên canvas 309 px của màn điện thoại, 14 nhãn vẫn chồng thành một đống chữ
     không đọc được — cùng con số ấy trên canvas 638 px lại thưa. Cái quyết định
     là CHỖ, không phải số. Văn bản đang mở và nút đang trỏ luôn được vẽ trước,
     nên chúng luôn thắng chỗ. */
  const hop = [];
  const veNhan = k => {
    const v = S.d.van_ban[SD.ds[k]];
    const t = tenNgan(v);
    const chinh = k === 0 || k === noi;
    c.font = (k === 0 ? "600 " : "") + "10px " + chuFont;
    const w = c.measureText(t).width, hh = 12;
    const px = X(k), py = Y(k) + SD.bkinh[k] * Math.min(1.25, Math.max(.75, z)) + 11;
    if (px < -60 || px > SD.W + 60 || py < -20 || py > SD.H + 20) return;
    const o = [px - w / 2 - 3, py - hh, px + w / 2 + 3, py + 3];
    if (hop.some(q => o[0] < q[2] && o[2] > q[0] && o[1] < q[3] && o[3] > q[1])) return;
    hop.push(o);
    c.globalAlpha = chinh ? 1 : .72;
    c.fillStyle = k === 0 ? SD.cGoc : SD.cChu;
    c.fillText(t, px, py);
  };
  veNhan(0);
  if (noi > 0) veNhan(noi);
  if (hienNhan) for (const k of SD.nhan) if (k !== 0 && k !== noi) veNhan(k);
  c.globalAlpha = 1;
}

function sdDoc(ten) {
  return getComputedStyle(document.documentElement).getPropertyValue(ten).trim();
}

function sdVong(id) {
  if (id !== SD.id || !SD.cv || !SD.cv.isConnected) return;
  if (SD.alpha > 0 || SD.keo >= 0) sdBuoc();
  sdVua();          /* chạy cả khi mạng đã đứng yên — xem chú thích trong sdVua */
  sdVe();
  requestAnimationFrame(() => sdVong(id));
}

function sdCo() {
  const h = SD.cv.getBoundingClientRect();
  SD.dpr = Math.min(devicePixelRatio || 1, 2);
  SD.W = h.width || SD.cv.parentElement.getBoundingClientRect().width;
  SD.H = h.height || 360;
  SD.cv.width = Math.round(SD.W * SD.dpr); SD.cv.height = Math.round(SD.H * SD.dpr);
}

function sdGan(k) {   /* nút gần con trỏ nhất, theo toạ độ màn hình */
  const z = SD.cam.z, ox = SD.W / 2 + SD.cam.x, oy = SD.H / 2 + SD.cam.y;
  let tot = -1, gan = 14 * 14;
  for (let i = 0; i < SD.ds.length; i++) {
    const dx = SD.x[i] * z + ox - k.x, dy = SD.y[i] * z + oy - k.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < gan) { gan = d2; tot = i; }
  }
  return tot;
}

/* Chuột và cảm ứng đi qua Pointer Events, không phải mouse/touch riêng: một bộ
   xử lý cho cả hai, và `setPointerCapture` giữ được cú kéo khi con trỏ ra ngoài
   canvas — thiếu nó thì kéo nhanh là nút rớt lại giữa chừng. */
function sdGanSuKien(cv) {
  const toado = e => {
    const h = cv.getBoundingClientRect();
    return { x: e.clientX - h.left, y: e.clientY - h.top };
  };
  cv.addEventListener("pointerdown", e => {
    const k = toado(e), i = sdGan(k);
    cv.setPointerCapture(e.pointerId);
    if (i >= 0) { SD.keo = i; SD.alpha = Math.max(SD.alpha, .34); }
    else { SD.panh = { x: e.clientX - SD.cam.x, y: e.clientY - SD.cam.y }; SD.tuTay = true; }
    SD.daDi = false;
  });
  cv.addEventListener("pointermove", e => {
    const k = toado(e);
    if (SD.keo >= 0) {
      const z = SD.cam.z;
      SD.x[SD.keo] = (k.x - SD.W / 2 - SD.cam.x) / z;
      SD.y[SD.keo] = (k.y - SD.H / 2 - SD.cam.y) / z;
      SD.daDi = true; return;
    }
    if (SD.panh) {
      SD.cam.x = e.clientX - SD.panh.x; SD.cam.y = e.clientY - SD.panh.y;
      SD.daDi = true; return;
    }
    const i = sdGan(k);
    if (i !== SD.tro) { SD.tro = i; cv.title = i >= 0 ? nhanNut(i) : ""; }
  });
  const thoi = () => { SD.keo = -1; SD.panh = null; };
  cv.addEventListener("pointerup", e => {
    /* Bấm mà không rê = mở văn bản đó. Rê rồi thả thì KHÔNG mở — nếu không thì
       mỗi lần kéo một nút cho dễ nhìn lại nhảy sang tài liệu khác. */
    if (!SD.daDi) {
      const i = sdGan(toado(e));
      if (i > 0) { thoi(); moTaiLieu("van_ban", SD.ds[i]); return; }
    }
    thoi();
  });
  cv.addEventListener("pointercancel", thoi);
  cv.addEventListener("pointerleave", () => { SD.tro = -1; });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const h = cv.getBoundingClientRect();
    const mx = e.clientX - h.left - SD.W / 2, my = e.clientY - h.top - SD.H / 2;
    const cu = SD.cam.z;
    const moi = Math.min(9, Math.max(.06, cu * Math.exp(-e.deltaY * .0016)));
    /* Phóng quanh CON TRỎ, không quanh tâm khung: phóng quanh tâm thì vùng đang
       nhìn trôi đi mất và phải rê lại từ đầu sau mỗi nấc. */
    SD.cam.x = mx - (mx - SD.cam.x) * (moi / cu);
    SD.cam.y = my - (my - SD.cam.y) * (moi / cu);
    SD.cam.z = moi;
    SD.tuTay = true;
  }, { passive: false });
}

function nhanNut(i) {
  const v = S.d.van_ban[SD.ds[i]];
  return v.n + " — " + v.t;
}

/* Tên ngắn để vẽ trên sơ đồ. Thường là số hiệu, nhưng có văn bản KHÔNG CÓ số
   hiệu — Hiến pháp năm 2013 mang đúng chữ "Không số" trong kho, và nó là văn bản
   được dẫn chiếu nhiều thứ hai (826 quan hệ). Dán "Không số" lên nút trung tâm
   của cả sơ đồ thì nhãn không nói gì cả. */
function tenNgan(v) {
  const t = /\d/.test(v.n) ? v.n : (v.t || v.n);
  return t.length > 22 ? t.slice(0, 21) + "…" : t;
}

/* MỘT bộ mô phỏng, hai chỗ dùng: sơ đồ trong popup tài liệu và sơ đồ nền ở
   khung hỏi đáp. Chúng không bao giờ cùng nhìn thấy được — popup che hết khung
   phía sau — nên dùng chung một `SD` thay vì nhân đôi cả bộ máy. Chỗ nào đang
   hiện thì chỗ đó nắm `SD`; `SD.id` cắt vòng lặp của chỗ cũ. */
function sdMauLai() {
  SD.cGoc = sdDoc("--fg"); SD.cAccent = sdDoc("--accent"); SD.cDo = sdDoc("--t-red");
  SD.cMo = sdDoc("--fg-3"); SD.cCanh = sdDoc("--fg-3"); SD.cNen = sdDoc("--bg-2");
  SD.cChu = sdDoc("--fg-3");
}

function khoiSoDo(goc, cv, toanKho, chayLai) {
  if (!cv) return;
  /* Canvas nằm trong một cột ĐANG ẨN thì đo ra 0×0 — dưới 1040 px cột trích dẫn
     bị media query tắt, và sơ đồ trích dẫn dựng trên khung 0 px là một bộ mô
     phỏng chạy không có gì để nhìn. Bỏ qua, và `hienCot()` sẽ gọi lại khi cột
     hiện ra. */
  if (!cv.getBoundingClientRect().width) { SD.id++; SD.cv = null; return; }
  SD.id++; SD.cv = cv; SD.ctx = cv.getContext("2d");
  if (toanKho !== undefined) SD.toanKho = toanKho;
  sdMauLai();
  sdCo();
  sdDung(goc, chayLai);
  /* Khớp khung NGAY, không nội suy, trước khung hình đầu. Nội suy 7% mỗi khung
     hình mà khởi đầu z = 1 thì nửa giây đầu khung nhìn còn đang thu về — trong
     nửa giây đó mạng nằm ngoài khung và chỉ thấy phần giữa. */
  sdVuaNgay();
  if (!chayLai) sdNong();
  sdVuaNgay();
  if (!cv.dataset.gan) { sdGanSuKien(cv); cv.dataset.gan = "1"; }
  capNhatGhiSoDo();
  sdVong(SD.id);
}

function capNhatGhiSoDo() {
  /* Tìm ô chú thích TRONG CÙNG khung với canvas đang vẽ, không tra theo id cố
     định: hai khung dùng chung một bộ mô phỏng nhưng mỗi khung có ô chú thích
     riêng, tra theo id thì cái ẩn cũng bị ghi. */
  const khung = SD.cv && SD.cv.parentElement;
  const el = khung && khung.querySelector(".ghi");
  /* Nói rõ đang xem PHẦN NÀO của kho. Một sơ đồ 90 nút và một sơ đồ 4.170 nút
     trông na ná nhau khi thu nhỏ, mà ý nghĩa thì khác hẳn — không ghi thì người
     xem tưởng mình đang nhìn cả kho trong khi chỉ thấy lân cận. */
  const lang = (S.ke.get(SD.ds[0]) || []).length;
  const cat = !SD.toanKho && !SD.tapChoSan && lang > SD.ds.length - 1;
  if (el) el.innerHTML = (SD.tapChoSan
      ? `${SD.soTrichDan} văn bản được trích dẫn`
        + (SD.soCau ? ` + ${SD.soCau} văn bản trung gian` : "")
      : SD.toanKho
      ? `Toàn kho · ${SD.ds.length.toLocaleString("vi")} văn bản`
      : `Quan hệ trực tiếp · ${(SD.ds.length - 1).toLocaleString("vi")} văn bản`
        + (cat ? ` (cắt từ ${lang.toLocaleString("vi")}, giữ nút nhiều quan hệ nhất)` : ""))
    + ` · ${SD.ca.length ? SD.ca.length.toLocaleString("vi") + " cạnh"
          : "không có quan hệ trực tiếp nào giữa chúng"}
    · <span style="color:var(--accent)">●</span> dẫn chiếu tới
    · <span style="color:var(--t-red)">●</span> bị dẫn chiếu
    · <span class="goi">kéo để xoay · lăn chuột để phóng · bấm để mở</span>`;
  const b = khung && khung.querySelector(".pv");
  if (b) b.textContent = SD.toanKho ? "Thu về lân cận" : "Xem toàn kho";
}

function htmlSoDo() {
  return `<div class="sodo">
    <canvas id="sodo-cv"></canvas>
    <button id="sodo-pv" class="pv"></button>
    <div class="ghi"></div>
  </div>`;
}

/* ════════════════ Sơ đồ nền ở khung hỏi đáp ════════════════
   Tâm sơ đồ nền là văn bản ĐƯỢC DẪN CHIẾU NHIỀU NHẤT trong kho, không phải một
   văn bản ngẫu nhiên: nó là điểm mốc có nghĩa để định vị mọi thứ còn lại, và
   cũng là câu trả lời cho "văn bản nào là trung tâm của kho này". */
function nutTrungTam() {
  let tot = 0, nhieu = -1;
  for (const [i, ke] of S.ke) if (ke.length > nhieu) { nhieu = ke.length; tot = i; }
  return tot;
}

/* Ba chỗ có thể hiện sơ đồ và chỉ MỘT bộ mô phỏng. Hàm này là người điều phối
   duy nhất: nó quyết định chỗ nào đang đáng hiện, rồi trao bộ mô phỏng cho chỗ
   đó. Trước đây mỗi chỗ tự gọi khởi tạo và tự đoán mình có nên chạy hay không —
   ba chỗ đoán độc lập là ba cơ hội để hai chỗ cùng tưởng mình đang nắm.
     popup đang mở        → sơ đồ trong popup (khoiSoDo gọi từ moTaiLieu)
     chưa có hội thoại    → sơ đồ toàn kho làm nền khung hỏi đáp
     đã có hội thoại      → sơ đồ quan hệ giữa các văn bản được trích dẫn */
function datSoDo(chayLai) {
  if (!S.d) return;
  const veSoDo = TC.sodo;
  const coHoiThoai = !!S.hoiThoai.length;

  /* BỀ RỘNG TRƯỚC, CANVAS SAU — ràng buộc thứ tự, không phải sở thích.
     Cột trích dẫn hiện ra hay mất đi làm cột giữa rộng hẹp khác nhau, mà canvas
     lấy bề rộng bằng cách ĐO. Đặt hai việc này trong hai hàm rồi gọi ngược thứ
     tự là hình bị kéo dãn theo tỉ lệ cũ — nên chúng nằm chung một hàm. */
  document.body.dataset.cotd = String(coHoiThoai);
  if (!coHoiThoai && innerWidth <= 1040 && $("#col3").dataset.mo === "true")
    hienCot("col2");

  const nenBat = !coHoiThoai && veSoDo;
  $("#chat").dataset.nen = String(nenBat);

  const nutTd = veSoDo ? tapTrichDan() : [];
  const mo = nutTd.length >= 2 ? themTrungGian(nutTd) : { ds: nutTd, soCau: 0 };
  const tdBat = coHoiThoai && mo.ds.length >= 2;
  $("#td-sodo").hidden = !tdBat;

  if ($("#dlg-doc").open) return;   /* popup đang nắm, không giành */

  if (nenBat) {
    SD.tapChoSan = null;
    khoiSoDo(nutTrungTam(), $("#sodo-nen-cv"), true, chayLai);
  } else if (tdBat) {
    /* Tâm là văn bản nối nhiều nhất TRONG TẬP — nó là chỗ hội tụ của câu trả
       lời, còn lấy cái đầu danh sách thì chỉ là ngẫu nhiên theo thứ tự trích. */
    let tam = nutTd[0], nhieu = -1;
    for (const g of nutTd) {
      const d = (S.ke.get(g) || []).filter(([j]) => mo.ds.includes(j)).length;
      if (d > nhieu) { nhieu = d; tam = g; }
    }
    SD.tapChoSan = mo.ds;
    SD.soTrichDan = nutTd.length;
    SD.soCau = mo.soCau;
    khoiSoDo(tam, $("#td-sodo-cv"), false, true);
  } else {
    SD.id++; SD.cv = null; SD.tapChoSan = null;
  }
}

/* Chỉ số toàn cục của những văn bản đang được trích dẫn và CÓ trong kho. Trích
   dẫn trỏ tới văn bản chưa cào được thì bỏ — vẽ một nút không có quan hệ nào và
   không mở được là thêm nhiễu, không thêm tin. */
function tapTrichDan() {
  const ra = [];
  for (const n of Object.keys(S.nguon)) {
    const md = (S.nguon[n] || {}).metadata || {};
    const sh = md.doc_ref || md.doc_num;
    if (!sh) continue;
    const j = S.d.van_ban.findIndex(v => v.n === sh);
    if (j >= 0 && !ra.includes(j)) ra.push(j);
  }
  return ra;
}

const SD_TRUNG_GIAN = 8;

/* Thêm VĂN BẢN TRUNG GIAN nối các văn bản được trích dẫn.
   Đo trên câu gợi ý đầu tiên: 5 văn bản được dẫn ra và KHÔNG cặp nào nối trực
   tiếp với nhau — sơ đồ thành năm chấm rời, không nói được gì. Nhưng chúng có
   nối, chỉ là qua một bước: một luật mà cả hai cùng dẫn chiếu. Chính cái nút ở
   giữa đó mới là câu trả lời cho "hai văn bản này liên quan thế nào".
   Chỉ nhận nút nối được ÍT NHẤT HAI văn bản trong tập — nút chỉ treo vào một cái
   thì không phải cầu nối, nó là láng giềng, và mở rộng theo láng giềng thì sơ đồ
   quay về nói chuyện của kho chứ không nói chuyện của câu trả lời. */
function themTrungGian(nut) {
  const trong = new Set(nut);
  const dem = new Map();
  for (const g of nut)
    for (const [j] of (S.ke.get(g) || []))
      if (!trong.has(j)) dem.set(j, (dem.get(j) || 0) + 1);
  const cau = [...dem.entries()]
    .filter(([, c]) => c >= 2)
    .sort((a, b) => b[1] - a[1])
    .slice(0, SD_TRUNG_GIAN)
    .map(([j]) => j);
  return { ds: nut.concat(cau), soCau: cau.length };
}

function veHome() {
  S.hoiThoai = []; S.nguon = {}; S.tdChon = null;
  $("#chat-log").innerHTML = "";
  $("#goi-y").hidden = false;
  $("#q").value = "";
  S.kho = "van_ban"; S.linhVuc = null;
  dongTaiLieu();
  dungLoc(); dungNhom(); veDanhSach(null); veNguon();
  $$(".c1 [data-kho]").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.kho === "van_ban")));
  hienCot("col2");
  datSoDo(true);
}

/* ════════════════ Chat có trích dẫn ════════════════ */
const NHAN_BUOC = {
  sub_queries: "Tách câu hỏi", retrieval: "Tìm trong kho",
  context_ready: "Dựng ngữ cảnh", tool_call: "Tra chéo văn bản", answer: "Soạn câu trả lời",
};

/* Dòng ghi chú dưới ô nhập đã BỎ. Nó nói chuyện cấu hình — chuyện của người
   dựng trang — với người đang đi tra cứu pháp luật. Việc phải nói với người đọc
   là mỗi câu trả lời dựa trên nguồn nào, và điều đó cột trích dẫn nói rõ hơn
   một dòng chữ. */

function veGoiY() {
  const gy = ["Doanh nghiệp mới thành lập phải nộp những gì trong 30 ngày đầu?",
              "Hợp đồng thuê đất dùng biểu mẫu nào, còn hiệu lực không?",
              "Mức phạt chậm nộp tờ khai thuế là bao nhiêu?"];
  $("#goi-y").innerHTML = gy.map(t => `<button type="button">${esc(t)}</button>`).join("");
}

function themTinNhan(vaiTro, noi) {
  const d = document.createElement("div");
  d.className = "tn " + (vaiTro === "user" ? "u" : "a");
  d.innerHTML = `<div class="ai">${vaiTro === "user" ? "Bạn" : "Trợ lý"}</div>
                 <div class="noi"></div>`;
  d.querySelector(".noi").textContent = noi || "";
  $("#chat-log").append(d);
  $("#chat-log").scrollTop = $("#chat-log").scrollHeight;
  return d.querySelector(".noi");
}

function veBuoc(hop, buoc, trangThai, phu) {
  const id = "b-" + buoc;
  let el = hop.querySelector("." + id);
  if (!el) {
    el = document.createElement("div");
    el.className = "buoc " + id;
    hop.append(el);
  }
  el.classList.remove("dang", "xong", "loi");
  el.classList.add(trangThai === "error" ? "loi" : trangThai === "done" ? "xong" : "dang");
  el.innerHTML = `<span class="tt"></span><span>${esc(NHAN_BUOC[buoc] || buoc)}${
    phu ? " · " + esc(phu) : ""}</span>`;
  $("#chat-log").scrollTop = $("#chat-log").scrollHeight;
}

/* Biến [N] thành thẻ bấm được. Đây là điểm cốt lõi: trích dẫn phải KIỂM CHỨNG
   ĐƯỢC, không phải chữ trang trí. Chỉ đánh dấu số nào THẬT SỰ có nguồn kèm —
   số bịa mà vẫn bấm được là tệ hơn không bấm được. */
function veTrichDan(el, text) {
  el.innerHTML = esc(text).replace(/\[(\d+)\]/g, (m, n) =>
    S.nguon[n] ? `<span class="tdan" data-td="${n}" title="Xem nguồn ${n}">${n}</span>` : m);
}

/* Cột trích dẫn vẽ TOÀN BỘ nguồn cùng lúc, không mở từng cái.
   Bản trước là panel trượt: bấm [3] thì panel đè lên chat, xem xong phải tắt rồi
   bấm [4]. Nhưng người đọc đối chiếu trích dẫn LIÊN TỤC trong lúc đọc câu trả
   lời — bắt họ mở-tắt từng cái là bắt họ mất mạch mỗi lần kiểm một nguồn. */
function veNguon() {
  datSoDo();
  const el = $("#td-ds");
  const so = Object.keys(S.nguon).sort((a, b) => +a - +b);
  $("#dem-td").textContent = so.length ? so.length + " nguồn" : "";
  if (!so.length) {
    el.innerHTML = '<div class="trong">Chưa có trích dẫn nào.<br>'
      + 'Nguồn của mỗi câu trả lời sẽ hiện ở đây, bấm được để đối chiếu.</div>';
    return;
  }
  el.innerHTML = so.map(n => {
    const c = S.nguon[n] || {}, md = c.metadata || {};
    const sh = md.doc_ref || md.doc_num || "";
    const j = sh ? S.d.van_ban.findIndex(x => x.n === sh) : -1;
    /* Hiệu lực tra từ KHO của mình, không tin trường `hieu_luc` mà nguồn gửi
       kèm: API bên ngoài có thể không có trường đó, hoặc có mà đã cũ. Kho này
       tính hiệu lực từ quan hệ dẫn chiếu và cập nhật theo từng đợt cào. */
    const hl = j >= 0 ? S.d.van_ban[j].e : null;
    return `<div class="td" data-td-the="${esc(n)}">
      <div><span class="so">${esc(n)}</span><span class="sh">${esc(sh || "—")}</span></div>
      ${hl ? `<div style="margin-top:5px">${pillHL(hl, "van_ban")}</div>` : ""}
      ${md.title ? `<div class="tt">${esc(md.title)}</div>` : ""}
      ${md.article ? `<div class="sh">${esc(md.article)}</div>` : ""}
      ${c.content ? `<div class="doan">${esc(c.content)}</div>` : ""}
      ${j >= 0 ? `<div class="mo" data-mo-vb="${j}">Mở văn bản →</div>` : ""}
    </div>`;
  }).join("");
  chonNguon(S.tdChon);
}

/* Chọn một nguồn: tô đậm ĐỒNG THỜI thẻ [N] trong câu trả lời và thẻ ở cột phải,
   rồi cuộn thẻ vào tầm nhìn. Nối hai đầu như vậy là toàn bộ lý do có cột này —
   không nối thì nó chỉ là một danh sách trôi nổi cạnh câu trả lời. */
function chonNguon(n) {
  S.tdChon = n;
  $$(".tdan").forEach(x => x.classList.toggle("chon", n != null && x.dataset.td === n));
  $$(".td").forEach(x => x.classList.toggle("chon", n != null && x.dataset.tdThe === n));
  if (n == null) return;
  const the = $(`.td[data-td-the="${CSS.escape(n)}"]`);
  if (the) {
    if (innerWidth <= 1040) hienCot("col3");
    the.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

async function hoi(cau) {
  if (S.dangChay) return;
  S.dangChay = true;
  $("#chat-gui").disabled = true;
  $("#goi-y").hidden = true;
  themTinNhan("user", cau);
  S.hoiThoai.push({ role: "user", content: cau });
  /* Gọi SAU khi đã ghi câu hỏi vào hội thoại, không trước: datSoDo() xét
     `S.hoiThoai.length` để biết nên hiện sơ đồ nào, gọi trước thì nó vẫn thấy
     hội thoại rỗng và giữ nguyên sơ đồ nền. */
  datSoDo();

  const hop = document.createElement("div");
  hop.className = "tn a";
  hop.innerHTML = '<div class="ai">Trợ lý</div>';
  const noi = document.createElement("div");
  noi.className = "noi";
  $("#chat-log").append(hop);

  try {
    if (!API.URL) { await traLoiThu(hop, noi, cau); }
    else { await goiAPI(hop, noi, cau); }
  } catch (e) {
    veBuoc(hop, "answer", "error", String(e.message || e).slice(0, 120));
  } finally {
    S.dangChay = false;
    $("#chat-gui").disabled = false;
    $("#chat-q").focus();
  }
}

/* Chế độ thử: không gọi mô hình nào. Nó tra trong kho rồi trả về tài liệu khớp
   kèm trích dẫn thật — đủ để kiểm giao diện trích dẫn hoạt động đúng trước khi
   có API, và KHÔNG bịa ra câu trả lời pháp lý nào. */
/* Từ chức năng tiếng Việt — PHẢI bỏ trước khi tra.
   Không bỏ thì câu "abcxyz câu hỏi vô nghĩa không liên quan gì" vẫn ra 5 văn bản,
   vì "câu", "hỏi", "không", "liên", "quan" khớp bừa vào hàng nghìn tiêu đề. Kết
   quả trông như tra cứu tồi, trong khi sự thật là KHÔNG CÓ GÌ khớp — và với một
   trang pháp lý thì vẻ ngoài có liên quan còn tệ hơn câu "không tìm thấy". */
const TU_CHUC_NANG = new Set(("cua va la co khong duoc cho den tu voi nhu thi ma "
  + "nay do nao gi sao bao nhieu the nao cau hoi lien quan phai can nen se dang "
  + "cac nhung mot hai ba trong ngoai tren duoi khi lam theo tai ve cung hay "
  + "toi ban chung ho minh ai dau day kia ra vao len xuong").split(" "));

/* Ngưỡng theo TỈ LỆ, không theo số tuyệt đối. Ngưỡng cố định 2 từ vẫn để nhiễu
   lọt: câu 8 từ chỉ cần khớp 2 là đủ, nên "thủ tục sa thải người lao động trái
   luật" ra 2273/QĐ-UBND — nó khớp đúng "thu" và "dong" (mà "dong" còn là "đồng",
   "động", "đóng"). Tra theo âm tiết trong tiếng Việt vốn nhiễu; đòi khớp một nửa
   số từ nội dung cắt được phần lớn. */
const TI_LE_KHOP = 0.5;
const TOI_THIEU_KHOP = 2;

/* HỆ SỐ HIỆU LỰC — nhân vào điểm khớp từ khoá.
   Không có nó thì xếp hạng chỉ theo từ khoá, và kho này có 2.335 văn bản hết
   hiệu lực toàn bộ so với 1.016 còn hiệu lực (kho lớn dần theo bao đóng dẫn
   chiếu, nên nó kéo vào rất nhiều luật đã bị thay). Hệ quả đo được: câu gợi ý
   "Doanh nghiệp mới thành lập phải nộp những gì trong 30 ngày đầu?" trả về 5/5
   văn bản đều `het_toan_bo` — đúng từ khoá mà vô dụng trên thực tế.
   Hạ điểm, KHÔNG loại bỏ: văn bản đã hết hiệu lực vẫn là câu trả lời đúng khi
   người ta hỏi đúng nó, và số hiệu khớp chính xác vẫn được 100 điểm tuyệt đối. */
const HE_SO_HL = {
  con_hieu_luc: 1, chua_hieu_luc: .8, het_mot_phan: .65,
  khong_ro: .45, het_toan_bo: .22,
};

async function traLoiThu(hop, noi, cau) {
  veBuoc(hop, "retrieval", "processing");
  await new Promise(r => setTimeout(r, 260));

  const thoLoc = goDau(cau).split(/[\s,.;:?!()]+/).filter(Boolean);
  const tu = [...new Set(thoLoc.filter(w => w.length > 2 && !TU_CHUC_NANG.has(w)))];
  /* Số hiệu trong câu hỏi là tín hiệu mạnh nhất — người gõ "96/2024/NĐ-CP" muốn
     đúng văn bản đó, không muốn 5 văn bản gần giống. */
  const soHieu = (cau.match(/\d{1,4}[A-ZĐa-zđ]?\/\d{4}\/[A-ZĐ][A-ZĐ0-9\-]*/g) || [])
    .map(x => goDau(x));

  /* KHỚP THEO RANH GIỚI TỪ, KHÔNG KHỚP CHUỖI CON. Đây đúng bài học mà
     src/analysis/lexicon.py của dự án này đã ghi: `if keyword in text` làm "nước"
     khớp cả "nhà nước". Ở đây tệ hơn vì tiếng Việt đơn âm — sau khi gỡ dấu thì
     "thu" là chuỗi con của "thủ", "thuế", "thuộc", "thù"; "dong" là chuỗi con của
     "đồng", "động", "đóng", "dòng". Câu 8 từ vì vậy khớp bừa 4 từ vào một quyết
     định cấp tỉnh chẳng liên quan gì. */
  const chamKhop = v => {
    if (soHieu.some(sh => goDau(v.n) === sh)) return 100;
    const am = new Set(goDau(v.n + " " + v.t).split(/[^a-z0-9]+/).filter(Boolean));
    return tu.reduce((a, w) => a + (am.has(w) ? 1 : 0), 0);
  };
  const nguong = soHieu.length ? 1
    : Math.max(TOI_THIEU_KHOP, Math.ceil(tu.length * TI_LE_KHOP));
  /* Ngưỡng lọc xét điểm KHỚP THÔ, còn thứ tự xét điểm ĐÃ NHÂN hiệu lực: hạ
     ngưỡng theo điểm đã nhân thì văn bản còn hiệu lực khớp ít cũng bị loại. */
  const top = S.d.van_ban.map(v => ({ v, k: chamKhop(v) }))
    .filter(x => x.k >= nguong)
    .map(x => ({ ...x, s: x.k * (HE_SO_HL[x.v.e] ?? .45) }))
    .sort((a, b) => b.s - a.s).slice(0, 5);

  veBuoc(hop, "retrieval", "done",
         tu.length ? `${top.length} tài liệu · ${tu.length} từ khoá` : "không có từ khoá");

  S.nguon = {}; S.tdChon = null;
  top.forEach((x, k) => {
    S.nguon[k + 1] = {
      metadata: { doc_ref: x.v.n, title: x.v.t, hieu_luc: x.v.e },
    };
  });
  veNguon();
  hop.append(noi);

  /* Câu mở đầu phải nói ĐÚNG cái nó đang làm, và không nhắc tới ⚙️ nữa: nút đó
     giờ là tuỳ chỉnh hiển thị, không phải chỗ thêm API. Việc thêm API là việc
     sửa mã nguồn (hằng số `API` ở đầu tệp) — chuyện của người dựng trang. */
  const dauCau = "Đây KHÔNG phải câu trả lời pháp lý. Trang đang tra theo tiêu đề "
    + "trong kho và xếp hạng ưu tiên văn bản còn hiệu lực, không gọi mô hình nào.\n\n";
  let text;
  if (!tu.length && !soHieu.length) {
    text = dauCau + "Câu hỏi không có từ khoá nào tra được. Thử gõ số hiệu văn bản "
      + "hoặc một cụm cụ thể như “hợp đồng thuê đất”, “tờ khai thuế”.";
  } else if (!top.length) {
    text = dauCau + `Không có văn bản nào trong kho khớp từ khoá: ${tu.join(", ")}.\n\n`
      + "Phần tra này chỉ đọc TIÊU ĐỀ và dữ kiện, chưa đọc nội dung điều khoản. "
      + "Thử một cụm khác, hoặc duyệt trực tiếp ở cột Nguồn.";
  } else {
    /* Ghi TÌNH TRẠNG HIỆU LỰC ngay cạnh từng số hiệu. Với một trang pháp lý,
       một danh sách số hiệu không kèm hiệu lực là một danh sách đọc được mà
       dùng không được. */
    const conHl = top.filter(x => x.v.e === "con_hieu_luc").length;
    text = dauCau + `Văn bản khớp từ khoá (${tu.join(", ")}) — `
      + `${conHl}/${top.length} còn hiệu lực:\n\n`
      + top.map((x, k) =>
          `${k + 1}. ${x.v.n} — ${nhanHL(x.v.e, "van_ban")} [${k + 1}]`).join("\n")
      + "\n\nBấm số trong ngoặc để xem nguồn, hoặc bấm tên văn bản ở cột phải "
      + "để mở toàn văn.";
  }
  veTrichDan(noi, text);
  S.hoiThoai.push({ role: "assistant", content: text });
}

/* Gọi API theo đúng hợp đồng SSE của R2AI2026:
     sub_queries → retrieval → context_ready → tool_call → answer(streaming|done)
   `citations` là map {"N": chunk}; `sources` chỉ có ở context_ready, KHÔNG có ở
   answer/done — nên phải gom dần chứ không đợi event cuối. */
async function goiAPI(hop, noi, cau) {
  veBuoc(hop, "sub_queries", "processing");
  const h = { "Content-Type": "application/json" };
  if (API.KHOA) h.Authorization = "Bearer " + API.KHOA;

  const r = await fetch(API.URL, {
    method: "POST", headers: h,
    body: JSON.stringify({ messages: S.hoiThoai, stream: true }),
  });
  if (!r.ok) throw new Error("API trả " + r.status);

  const doc = r.body.getReader();
  const dec = new TextDecoder();
  let dem = "", traLoi = "", daGanNoi = false;
  S.nguon = {}; S.tdChon = null; veNguon();

  for (;;) {
    const { value, done } = await doc.read();
    if (done) break;
    dem += dec.decode(value, { stream: true });
    const dong = dem.split("\n\n");
    dem = dong.pop() || "";
    for (const kh of dong) {
      const m = kh.match(/^data:\s*(.*)$/ms);
      if (!m) continue;
      const raw = m[1].trim();
      if (raw === "[DONE]") continue;
      let ev; try { ev = JSON.parse(raw); } catch { continue; }

      if (ev.data?.citations) { Object.assign(S.nguon, ev.data.citations); veNguon(); }
      const phu =
        ev.data?.count != null ? ev.data.count + " đoạn" :
        ev.data?.queries ? ev.data.queries.length + " truy vấn con" :
        ev.data?.found_count != null ? ev.data.found_count + " đoạn" :
        ev.data?.args?.doc_ref ? ev.data.args.doc_ref : "";

      if (ev.step === "answer" && ev.status === "streaming") {
        if (!daGanNoi) { hop.append(noi); daGanNoi = true; }
        traLoi += ev.data?.chunk || "";
        veTrichDan(noi, traLoi);
        $("#chat-log").scrollTop = $("#chat-log").scrollHeight;
      } else if (ev.step === "answer" && ev.status === "done") {
        if (!daGanNoi) { hop.append(noi); daGanNoi = true; }
        traLoi = ev.data?.text || traLoi;
        veTrichDan(noi, traLoi);
        veBuoc(hop, "answer", "done");
      } else if (ev.status === "error") {
        veBuoc(hop, ev.step, "error", ev.data?.error);
      } else {
        veBuoc(hop, ev.step, ev.status === "done" ? "done" : "processing", phu);
      }
    }
  }
  if (traLoi) S.hoiThoai.push({ role: "assistant", content: traLoi });
}

/* ════════════════ Sự kiện ════════════════ */
function hienCot(id) {
  /* Chỉ có nghĩa ở màn hẹp. Trên màn rộng cả ba cột luôn hiện, nên đặt data-mo
     ở đây vẫn vô hại: quy tắc ẩn nằm trong media query. */
  $$(".cols > .col").forEach(c => c.dataset.mo = String(c.id === id));
  $$(".mnav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.cot === id)));
  /* Cột vừa hiện ra thì sơ đồ trong nó mới đo được kích thước — gọi lại người
     điều phối. Không gọi thì trên màn hẹp sơ đồ trích dẫn không bao giờ dựng,
     vì lúc nó được yêu cầu dựng thì cột còn đang ẩn. */
  if (S.d) datSoDo();
}

document.addEventListener("click", e => {
  const t = e.target;

  const kho = t.closest(".kho-chon [data-kho]");
  if (kho) {
    S.kho = kho.dataset.kho; S.linhVuc = null;
    $$(".c1 [data-kho]").forEach(b =>
      b.setAttribute("aria-selected", String(b === kho)));
    dungLoc(); dungNhom(); veDanhSach(null);
    return;
  }
  const muc = t.closest(".muc");
  if (muc) { moTaiLieu(muc.dataset.kho, +muc.dataset.i); return; }

  const cot = t.closest("[data-cot]");
  if (cot) { hienCot(cot.dataset.cot); return; }

  const moVB = t.closest("[data-mo-vb]");
  if (moVB) {
    e.preventDefault();
    S.kho = "van_ban"; S.linhVuc = null; dungLoc(); dungNhom(); veDanhSach(null);
    moTaiLieu("van_ban", +moVB.dataset.moVb);
    return;
  }
  const moBM = t.closest("[data-mo-bm]");
  if (moBM) {
    e.preventDefault();
    const i = S.d.bieu_mau.findIndex(b => b.k === moBM.dataset.moBm);
    if (i >= 0) {
      S.kho = "bieu_mau"; S.linhVuc = null; dungLoc(); dungNhom(); veDanhSach(null);
      moTaiLieu("bieu_mau", i);
    }
    return;
  }
  const td = t.closest("[data-td]");
  if (td) { chonNguon(td.dataset.td); return; }
  const the = t.closest(".td");
  if (the) { chonNguon(the.dataset.tdThe); return; }

  if (t.closest("#goi-y button")) { hoi(t.textContent.trim()); return; }
  if (t.closest("#doc-dong")) { dongTaiLieu(); return; }
  /* Bấm ra NGOÀI popup thì đóng. Cú bấm vào phần nền của <dialog> có target
     đúng bằng chính thẻ dialog — mọi cú bấm vào ruột đều có target là con của
     nó. Đó là cách phân biệt duy nhất không cần thêm lớp phủ giả. */
  if (t === $("#dlg-doc")) { dongTaiLieu(); return; }
  if (t.closest("#sodo-pv")) {
    SD.toanKho = !SD.toanKho;
    sdDung(SD.ds[0], true);
    sdVuaNgay(); capNhatGhiSoDo();
    return;
  }
  if (t.closest("#doc-sodo")) {
    $("#doc-noi .sodo")?.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (t.closest("#doc-goc")) {
    if (!S.mo) return;
    const v = (S.mo.kho === "van_ban" ? S.d.van_ban : S.d.bieu_mau)[S.mo.i];
    /* Bản TOÀN VĂN trên Drive đứng trước trang Quartz.
       Nút này tên "Trang gốc" và người bấm vào để ĐỌC văn bản. Trang Quartz thì
       chỉ có dữ kiện và quan hệ dẫn chiếu — nó nói rõ điều đó, nhưng ai bấm vào
       cũng đã mất một lần chuyển trang để biết. Đi tiếp từ đó thì gặp cổng API
       Bộ Tư pháp trả về XML thô. Ba lần bấm, không đọc được chữ nào của văn bản.
       Drive là bản kho tự giữ, mở thẳng ra nội dung. */
    open(v.g ? urlDrive(v.g)
             : `${GOC}/${S.mo.kho === "van_ban" ? "van-ban" : "bieu-mau"}/${v.s}`,
         "_blank");
    return;
  }
  if (t.closest("#btn-home")) { veHome(); return; }
  if (t.closest("#btn-cfg")) {
    $("#dlg-cfg").showModal();
    return;
  }
  if (t.closest("#cfg-dong")) { $("#dlg-cfg").close(); return; }
  if (t.closest("#ct-toi")) { datTheme(document.documentElement.dataset.theme !== "dark"); return; }
  if (t.closest("#ct-sodo")) { datVeSoDo(!TC.sodo); return; }
});

let henCo;
addEventListener("resize", () => {
  clearTimeout(henCo);
  henCo = setTimeout(() => {
    if (SD.cv && SD.cv.isConnected) { sdCo(); sdVuaNgay(); }
  }, 120);
});

let hen;
$("#q").addEventListener("input", e => {
  clearTimeout(hen);
  hen = setTimeout(() => {
    veDanhSach(tra(e.target.value) || null);
    if (innerWidth <= 860) hienCot("col1");
  }, 130);
});

$("#loc-lv").addEventListener("change", e => {
  const v = e.target.value;
  /* Lĩnh vực văn bản là SỐ, nghiệp vụ biểu mẫu là CHUỖI — ép sai kiểu thì
     `v.f === S.linhVuc` không bao giờ đúng và bộ lọc im lặng trả rỗng. */
  S.linhVuc = v === "" ? null : (S.kho === "van_ban" ? +v : v);
  veDanhSach(null);
});
$("#loc-hl").addEventListener("change", () => veDanhSach(null));
$("#loc-cap").addEventListener("change", () => veDanhSach(null));

$("#chat-form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#chat-q").value.trim();
  if (!v) return;
  $("#chat-q").value = ""; $("#chat-q").style.height = "auto";
  hoi(v);
});
$("#chat-q").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px";
});
$("#chat-q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chat-form").requestSubmit(); }
});
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  if (e.key === "Escape" && !$("#dlg-doc").open) chonNguon(null);
});

/* ── Khởi động ── */
datTheme(TC.toi);
$("#ct-sodo").setAttribute("aria-checked", String(TC.sodo));
hienCot("col2");
document.body.dataset.cotd = "false";
veNguon();
nap().then(() => { veGoiY(); datSoDo(true); }).catch(e => {
  $("#ds").innerHTML = `<div class="trong">${esc(e.message)}</div>`;
});

</script>
</body>
</html>
